<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Entregas - JD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  /* ===== FUNDO (igual ao CRM) ===== */
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:url("fundo.jpg") no-repeat center center fixed;
    background-size:cover;
    color:#fff;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 30% 12%, rgba(33,150,243,0.18), transparent 45%),
      radial-gradient(circle at 80% 35%, rgba(76,175,80,0.10), transparent 45%),
      rgba(0,0,0,0.22);
    z-index:-1;
  }

  .container{
    max-width:1100px;
    margin:auto;
    padding:26px 18px 40px;
  }

  /* ===== TOPO ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .title{
    margin:0;
    font-size:34px;
    font-weight:900;
    letter-spacing:.2px;
  }
  .top-actions{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .btn-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(12px);
    cursor:pointer;
    color:#fff;
    font-weight:900;
    transition:.25s ease;
    user-select:none;
  }
  .btn-pill:hover{ transform:translateY(-1px); background:rgba(255,255,255,0.12); }

  /* ===== FILTROS ===== */
  .filters{
    display:grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap:10px;
    margin:12px 0 18px;
  }
  .control{
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(0,0,0,0.22);
    color:#fff;
    border-radius:14px;
    padding:12px 14px;
    outline:none;
    font-weight:900;
    backdrop-filter:blur(10px);
  }
  .control::placeholder{ color: rgba(255,255,255,0.55); font-weight:800; }

  /* ===== LISTA / SEÇÕES ===== */
  .section{
    margin:14px 0;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.16);
    border-radius:18px;
    overflow:hidden;
    backdrop-filter: blur(14px);
    box-shadow:0 18px 46px rgba(0,0,0,0.35);
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
    background: rgba(0,0,0,0.18);
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  .section-head .zone{
    font-weight:1000;
    letter-spacing:.3px;
    font-size:18px;
  }
  .section-head .count{
    opacity:.9;
    font-weight:900;
  }
  .section-body{
    display:none;
    padding:14px 14px 6px;
  }
  .section.open .section-body{ display:block; }

  /* ===== CARD ===== */
  .card{
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.20);
    border-radius:18px;
    padding:14px 14px 12px;
    margin-bottom:12px;
    box-shadow:0 10px 26px rgba(0,0,0,0.35);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .pedido{
    margin:0 0 6px;
    font-size:18px;
    font-weight:1000;
  }
  .pill{
    padding:8px 12px;
    border-radius:999px;
    font-weight:1000;
    border:1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.25);
    white-space:nowrap;
  }
  .pill.entrega{ border-color: rgba(33,150,243,0.35); }
  .line{
    margin:6px 0;
    font-weight:850;
    opacity:.96;
  }
  .muted{ opacity:.75; font-weight:800; }

  .actions{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(0,0,0,0.18);
    color:#fff;
    font-weight:1000;
    cursor:pointer;
    transition:.2s ease;
  }
  .btn:hover{ transform: translateY(-1px); background:rgba(255,255,255,0.10); }
  .btn.primary{
    background: rgba(76,175,80,0.25);
    border-color: rgba(76,175,80,0.35);
  }

  .btn-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:10px;
  }

  .empty{
    padding:16px;
    opacity:.85;
    font-weight:900;
    text-align:center;
  }

  @media (max-width: 820px){
    .title{ font-size:28px; }
    .filters{ grid-template-columns: 1fr; }
    .actions{ grid-template-columns: 1fr; }
    .btn-row{ grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
<div class="container">

  <div class="topbar">
    <h1 class="title">Entregas</h1>
    <div class="top-actions">
      <button class="btn-pill" type="button" onclick="location.href='jader.html'">Voltar</button>
      <button id="btnSair" class="btn-pill" type="button">Sair</button>
    </div>
  </div>

  <div class="filters">
    <select id="zonaFiltro" class="control">
      <option value="">Todas as Zonas</option>
    </select>

    <input id="dataFiltro" type="date" class="control" />

    <input id="buscaFiltro" class="control" placeholder="Buscar por pedido, cliente, cidade..." />
  </div>

  <div id="lista"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let vendasCache = [];

const listaEl = document.getElementById("lista");
const zonaFiltro = document.getElementById("zonaFiltro");
const dataFiltro = document.getElementById("dataFiltro");
const buscaFiltro = document.getElementById("buscaFiltro");

function formatarZona(z){
  const map = {
    centro: "Centro",
    zona_norte: "Zona Norte",
    zona_sul: "Zona Sul",
    zona_leste: "Zona Leste",
    zona_oeste: "Zona Oeste",
    abc_paulista: "ABC Paulista",
    litoral_sul: "Litoral Sul",
    litoral_norte: "Litoral Norte",
    sudoeste: "Sudoeste",
    interior: "Interior"
  };
  return map[z] || (z ? String(z) : "-");
}

function moedaBRL(n){
  return Number(n || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function normalizarTexto(s){
  return String(s || "").toLowerCase().trim();
}

/* ====== BLOQUEIO: só entregador ======
   Coleção: entregadores
   DocId: email do entregador (ex: "joao@gmail.com")
*/
async function validarEntregador(user){
  const ref = doc(db, "entregadores", user.email);
  const snap = await getDoc(ref);
  return snap.exists();
}

async function carregarPedidosEntrega(){
  listaEl.innerHTML = "Carregando...";

  // Mostra pedidos que já estão "em_entrega"
  // (você vai setar esse status no botão "Enviar para Entrega" da produção)
  const snap = await getDocs(collection(db, "vendas"));
  vendasCache = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(v => v.status === "em_entrega");

  montarZonasNoSelect();
  render();
}

function montarZonasNoSelect(){
  const zonas = [...new Set(vendasCache.map(v => v.zona).filter(Boolean))].sort();
  zonaFiltro.innerHTML = `<option value="">Todas as Zonas</option>` +
    zonas.map(z => `<option value="${z}">${formatarZona(z)}</option>`).join("");
}

function aplicarFiltros(){
  const z = zonaFiltro.value;
  const d = dataFiltro.value;       // yyyy-mm-dd
  const b = normalizarTexto(buscaFiltro.value);

  return vendasCache.filter(v => {
    if (z && v.zona !== z) return false;
    if (d && v.dataEntrega !== d) return false;

    if (b){
      const alvo = [
        v.pedido,
        v.cliente?.nome,
        v.cliente?.cidade,
        v.vendedorNome
      ].map(normalizarTexto).join(" ");
      if (!alvo.includes(b)) return false;
    }
    return true;
  });
}

function agruparPorZona(lista){
  const grupos = {};
  lista.forEach(v => {
    const z = v.zona || "sem_zona";
    if (!grupos[z]) grupos[z] = [];
    grupos[z].push(v);
  });
  return grupos;
}

function enderecoCompleto(v){
  const c = v.cliente || {};
  const partes = [
    c.rua, c.numero, c.bairro, c.cidade, c.cep
  ].filter(Boolean);
  return partes.join(" - ");
}

function copiarTexto(texto){
  navigator.clipboard.writeText(texto || "")
    .then(()=>alert("Copiado!"))
    .catch(()=>alert("Não consegui copiar agora."));
}

function abrirMaps(v){
  const end = enderecoCompleto(v);
  const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(end);
  window.open(url, "_blank", "noopener");
}

function imprimirPedido(v){
  // Modelo Premium B (impressão)
  const logoSrc = "logo-jd.png";
  const empresa = "JD FÁBRICA DE ESTOFADOS";

  const end = enderecoCompleto(v);
  const cliente = v.cliente?.nome || "-";
  const contato = v.cliente?.contato || "-";
  const cidade = v.cliente?.cidade || "-";
  const zona = formatarZona(v.zona);
  const pedido = v.pedido || "-";
  const dataPedido = v.dataPedido || "-";
  const dataEntrega = v.dataEntrega || "-";
  const modelo = v.produto?.modelo || "-";
  const cor = v.produto?.cor || "-";
  const tamanho = v.produto?.tamanho || "-";
  const total = moedaBRL(v.total ?? v.valor ?? 0);

  const w = window.open("", "_blank");
  w.document.write(`
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Pedido ${pedido}</title>
    <style>
      body{ font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4; }
      .page{ max-width: 820px; margin: 18px auto; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.15); }
      .head{
        padding:18px 22px;
        display:flex; align-items:center; gap:14px;
        border-bottom: 2px solid #d4af37;
      }
      .head img{ width:70px; height:70px; object-fit:contain; }
      .head .t{ line-height:1.1; }
      .head .t .n{ font-size:18px; font-weight:900; }
      .head .t .s{ font-size:13px; opacity:.8; font-weight:700; }

      .box{ padding:18px 22px; }
      .grid{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:12px;
      }
      .card{
        border:1px solid #e7e7e7;
        border-radius:12px;
        padding:12px 14px;
        background:#fafafa;
      }
      .label{ font-size:12px; opacity:.7; font-weight:800; margin-bottom:4px; }
      .value{ font-size:14px; font-weight:900; }

      .big{
        margin-top:12px;
        border:1px solid #e7e7e7;
        border-radius:12px;
        padding:14px;
      }
      .row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed #ddd; }
      .row:last-child{ border-bottom:none; }
      .row b{ min-width:120px; }

      .sign{
        margin-top:16px;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:18px;
      }
      .line{
        border-top:2px solid #000;
        padding-top:6px;
        font-weight:800;
        text-align:center;
      }

      .footer{
        padding:14px 22px;
        background:#0f0f0f;
        color:#fff;
        font-weight:800;
        display:flex;
        justify-content:space-between;
      }

      @media print{
        body{ background:#fff; }
        .page{ box-shadow:none; margin:0; border-radius:0; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="head">
        <img src="${logoSrc}" alt="Logo JD">
        <div class="t">
          <div class="n">${empresa}</div>
          <div class="s">Comprovante de Pedido / Entrega</div>
        </div>
      </div>

      <div class="box">
        <div class="grid">
          <div class="card">
            <div class="label">Pedido</div>
            <div class="value">#${pedido}</div>
          </div>
          <div class="card">
            <div class="label">Total</div>
            <div class="value">${total}</div>
          </div>
          <div class="card">
            <div class="label">Data do Pedido</div>
            <div class="value">${dataPedido}</div>
          </div>
          <div class="card">
            <div class="label">Data da Entrega</div>
            <div class="value">${dataEntrega}</div>
          </div>
        </div>

        <div class="big">
          <div class="row"><b>Cliente:</b> <span>${cliente}</span></div>
          <div class="row"><b>Contato:</b> <span>${contato}</span></div>
          <div class="row"><b>Cidade:</b> <span>${cidade}</span></div>
          <div class="row"><b>Zona:</b> <span>${zona}</span></div>
          <div class="row"><b>Endereço:</b> <span>${end || "-"}</span></div>
          <div class="row"><b>Produto:</b> <span>${modelo}</span></div>
          <div class="row"><b>Cor / Tamanho:</b> <span>${cor} / ${tamanho}</span></div>
        </div>

        <div class="sign">
          <div class="line">Assinatura do Cliente</div>
          <div class="line">Assinatura do Entregador</div>
        </div>
      </div>

      <div class="footer">
        <div>Pedido #${pedido}</div>
        <div>${empresa}</div>
      </div>
    </div>

    <script>
      window.onload = () => window.print();
    <\/script>
  </body>
  </html>
  `);
  w.document.close();
}

async function marcarEntregue(id){
  const ok = confirm("Confirmar: este pedido foi ENTREGUE?");
  if(!ok) return;

  await updateDoc(doc(db, "vendas", id), {
    status: "entregue",
    entregueEm: new Date().toISOString()
  });

  alert("Pedido marcado como entregue!");
  carregarPedidosEntrega();
}

function render(){
  const lista = aplicarFiltros();

  if(!lista.length){
    listaEl.innerHTML = `<div class="empty">Nenhum pedido em entrega com esses filtros.</div>`;
    return;
  }

  const grupos = agruparPorZona(lista);
  const zonasOrdenadas = Object.keys(grupos).sort((a,b) => formatarZona(a).localeCompare(formatarZona(b)));

  listaEl.innerHTML = zonasOrdenadas.map(z => {
    const itens = grupos[z];

    const cards = itens.map(v => {
      const cliente = v.cliente?.nome || "-";
      const contato = v.cliente?.contato || "-";
      const cidade = v.cliente?.cidade || "-";
      const zonaTxt = formatarZona(v.zona);
      const pedido = v.pedido || "-";
      const dataEntrega = v.dataEntrega || "-";
      const modelo = v.produto?.modelo || "-";
      const total = moedaBRL(v.total ?? v.valor ?? 0);

      return `
        <div class="card">
          <div class="card-top">
            <div>
              <p class="pedido">Pedido #${pedido}</p>
              <div class="line">Cliente: <b>${cliente}</b></div>
              <div class="line muted">Entrega: <b>${dataEntrega}</b> • Zona: <b>${zonaTxt}</b></div>
            </div>
            <div class="pill entrega">EM ENTREGA</div>
          </div>

          <div class="line">Produto: <b>${modelo}</b></div>
          <div class="line">Contato: <b>${contato}</b> • Cidade: <b>${cidade}</b></div>
          <div class="line">Endereço: <b>${enderecoCompleto(v) || "-"}</b></div>
          <div class="line"><b>Total:</b> ${total}</div>

          <div class="actions">
            <button class="btn primary" onclick="marcarEntregue('${v.id}')">Marcar como entregue</button>
            <button class="btn" onclick="abrirMapsById('${v.id}')">Abrir no Maps</button>
          </div>

          <div class="btn-row">
            <button class="btn" onclick="copiarContatoById('${v.id}')">Copiar contato</button>
            <button class="btn" onclick="imprimirById('${v.id}')">Imprimir pedido</button>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="copiarEnderecoById('${v.id}')">Copiar endereço</button>
            <button class="btn" onclick="copiarPedidoById('${v.id}')">Copiar nº do pedido</button>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="section open">
        <div class="section-head" onclick="toggleSection(this)">
          <div class="zone">${formatarZona(z)}</div>
          <div class="count">${itens.length} pedido(s)</div>
        </div>
        <div class="section-body">${cards}</div>
      </div>
    `;
  }).join("");
}

/* ===== Helpers globais pros botões do HTML ===== */
window.toggleSection = (head) => {
  const section = head.closest(".section");
  section.classList.toggle("open");
};

function acharVenda(id){ return vendasCache.find(v => v.id === id); }

window.abrirMapsById = (id) => {
  const v = acharVenda(id);
  if(!v) return;
  abrirMaps(v);
};
window.copiarContatoById = (id) => {
  const v = acharVenda(id);
  if(!v) return;
  const txt = v.cliente?.contato || "";
  copiarTexto(txt);
};
window.copiarEnderecoById = (id) => {
  const v = acharVenda(id);
  if(!v) return;
  copiarTexto(enderecoCompleto(v));
};
window.copiarPedidoById = (id) => {
  const v = acharVenda(id);
  if(!v) return;
  copiarTexto(String(v.pedido || ""));
};
window.imprimirById = (id) => {
  const v = acharVenda(id);
  if(!v) return;
  imprimirPedido(v);
};
window.marcarEntregue = marcarEntregue;

/* ===== Eventos filtros ===== */
zonaFiltro.onchange = render;
dataFiltro.onchange = render;
buscaFiltro.oninput = render;

/* ===== Auth ===== */
onAuthStateChanged(auth, async (user) => {
  if(!user){
    location.href = "login.html";
    return;
  }

  const ehEntregador = await validarEntregador(user);
  if(!ehEntregador){
    alert("Acesso restrito: apenas entregadores.");
    location.href = "login.html";
    return;
  }

  carregarPedidosEntrega();
});

document.getElementById("btnSair").onclick = async () => {
  await signOut(auth);
  location.href = "login.html";
};
</script>

</body>
</html>
