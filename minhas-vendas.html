<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; }
.container { max-width:500px; margin:auto; padding:16px; }
h1 { margin-bottom:20px; }
.card {
  background:white;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:8px;
  cursor:pointer;
}
.btn-cancelar {
  background:#d32f2f;
  color:white;
}
.btn-voltar {
  background:#1976d2;
  color:white;
}
.status {
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<h1>Minhas Vendas</h1>

<div id="listaVendas"></div>

<button class="btn-voltar" onclick="location.href='index.html'">
Voltar
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  getDocs, 
  doc, 
  updateDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  const lista = document.getElementById("listaVendas");

  const q = query(
    collection(db, "vendas"),
    where("vendedorEmail", "==", user.email)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    lista.innerHTML = "<p>Nenhuma venda encontrada.</p>";
    return;
  }

  snapshot.forEach(docSnap => {
    const venda = docSnap.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>Pedido:</strong> ${venda.pedido}<br>
      <strong>Cliente:</strong> ${venda.cliente.nome}<br>
      <strong>Total:</strong> R$ ${venda.total.toFixed(2)}<br>
      <strong class="status">Status:</strong> ${venda.status}
    `;

    if (venda.status === "pendente") {
      const btn = document.createElement("button");
      btn.textContent = "Cancelar";
      btn.className = "btn-cancelar";

      btn.onclick = async () => {
        const motivo = prompt("Informe o motivo do cancelamento:");

        if (!motivo || motivo.trim() === "") {
          alert("Motivo obrigatório.");
          return;
        }

        await updateDoc(doc(db, "vendas", docSnap.id), {
          status: "cancelado",
          motivoCancelamento: motivo
        });

        location.reload();
      };

      div.appendChild(btn);
    }

    lista.appendChild(div);
  });

});
</script>
</body>
</html>
