<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;

  /* 🔥 Fundo premium */
  background: url("fundo.jpg") no-repeat center center fixed;
  background-size: cover;
  position: relative;
  color: #fff;
}

/* Overlay escuro elegante */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  z-index: -1;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  font-weight: bold;
}

/* Cards das vendas */
.card {
  background: rgba(255,255,255,0.95);
  color: #333;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
}

button {
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  margin-top: 8px;
}

.btn-voltar {
  background: #1976d2;
  color: white;
}

.btn-voltar:hover {
  background: #125aa0;
}
</style>
  
</head>

<body>

<div class="container">

<h1>Minhas Vendas</h1>

<div class="filtros">
  <input type="date" id="filtroData">
  <input type="text" id="filtroCliente" placeholder="Nome do cliente">
  <input type="text" id="filtroPedido" placeholder="Número do pedido">
  <button id="btnFiltrar">Filtrar</button>
  <button id="btnLimpar">Limpar Filtros</button>
</div>

<div id="listaVendas"></div>

<div class="paginacao">
  <button id="btnAnterior">Anterior</button>
  <button id="btnProxima">Próxima</button>
</div>

<button class="btn-voltar" onclick="location.href='index.html'">
Voltar
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  getDocs, 
  doc, 
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let todasVendas = [];
let vendasFiltradas = [];
let paginaAtual = 1;
const itensPorPagina = 5;

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  const q = query(
    collection(db, "vendas"),
    where("vendedorEmail", "==", user.email),
  );

  const snapshot = await getDocs(q);

  snapshot.forEach(docSnap => {
    todasVendas.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  todasVendas.sort((a, b) => {
    return new Date(b.dataPedido) - new
  Date(a.dataPedido);  
});

  vendasFiltradas = [...todasVendas];
  renderizarPagina();
});

function renderizarPagina() {

  const lista = document.getElementById("listaVendas");
  lista.innerHTML = "";

  const inicio = (paginaAtual - 1) * itensPorPagina;
  const fim = inicio + itensPorPagina;
  const pagina = vendasFiltradas.slice(inicio, fim);

  if (pagina.length === 0) {
    lista.innerHTML = "<p>Nenhuma venda encontrada.</p>";
    return;
  }

  pagina.forEach(venda => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>Pedido:</strong> ${venda.pedido || "-"}<br>
      <strong>Cliente:</strong> ${venda.cliente?.nome || "-"}<br>
      <strong>Total:</strong> R$ ${venda.total?.toFixed(2) || "0.00"}<br>
      <strong class="status">Status:</strong> ${venda.status}
    `;

    if (venda.status === "cancelado" && venda.motivoCancelamento) {
      div.innerHTML += `<div class="motivo">Motivo: ${venda.motivoCancelamento}</div>`;
    }

if (venda.status !== "aprovado" && venda.status !== "cancelado") {

  /* BOTÃO CANCELAR */
  const btnCancelar = document.createElement("button");
  btnCancelar.textContent = "Cancelar";
  btnCancelar.className = "btn-cancelar";

  btnCancelar.onclick = async () => {
    const motivo = prompt("Informe o motivo do cancelamento:");

    if (!motivo || motivo.trim() === "") {
      alert("Motivo obrigatório.");
      return;
    }

    await updateDoc(doc(db, "vendas", venda.id), {
      status: "cancelado",
      motivoCancelamento: motivo
    });

    alert("Venda cancelada com sucesso!");
    location.reload();
  };

  div.appendChild(btnCancelar);


  /* BOTÃO EDITAR */
  const btnEditar = document.createElement("button");
  btnEditar.textContent = "Editar";
  btnEditar.style.background = "#f0ad4e";
  btnEditar.style.marginLeft = "8px";

  btnEditar.onclick = () => {
    location.href = editar-venda.html?id=${venda.id}`;
  };

  div.appendChild(btnEditar);


  /* BOTÃO EXCLUIR */
  const btnExcluir = document.createElement("button");
  btnExcluir.textContent = "Excluir";
  btnExcluir.style.background = "#d9534f";
  btnExcluir.style.marginLeft = "8px";

  btnExcluir.onclick = async () => {
    const confirmar = confirm("Tem certeza que deseja excluir esta venda? Essa ação não pode ser desfeita.");

    if (!confirmar) return;

    await deleteDoc(doc(db, "vendas", venda.id));

    alert("Venda excluída com sucesso!");
    location.reload();
  };

  div.appendChild(btnExcluir);
}

    lista.appendChild(div);
  });
}

document.getElementById("btnFiltrar").onclick = () => {

  const data = document.getElementById("filtroData").value;
  const cliente = document.getElementById("filtroCliente").value.toLowerCase();
  const pedido = document.getElementById("filtroPedido").value.toLowerCase();

  vendasFiltradas = todasVendas.filter(venda => {

    const matchCliente = venda.cliente?.nome?.toLowerCase().includes(cliente);
    const matchPedido = venda.pedido?.toLowerCase().includes(pedido);

    let matchData = true;

   if (data && venda.dataPedido) {
    matchData = venda.dataPedido === data;
}

    return matchCliente && matchPedido && matchData;
  });

  paginaAtual = 1;
  renderizarPagina();
};

document.getElementById("btnLimpar").onclick = () => {
  document.getElementById("filtroData").value = "";
  document.getElementById("filtroCliente").value = "";
  document.getElementById("filtroPedido").value = "";

  vendasFiltradas = [...todasVendas];
  paginaAtual = 1;
  renderizarPagina();
};

document.getElementById("btnAnterior").onclick = () => {
  if (paginaAtual > 1) {
    paginaAtual--;
    renderizarPagina();
  }
};

document.getElementById("btnProxima").onclick = () => {
  if (paginaAtual * itensPorPagina < vendasFiltradas.length) {
    paginaAtual++;
    renderizarPagina();
  }
};
</script>
</body>
</html>
