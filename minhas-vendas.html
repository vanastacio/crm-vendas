<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { 
  margin:0; 
  font-family:Arial; 
  background:#f4f6f8; 
}

.container { 
  max-width:500px; 
  margin:auto; 
  padding:16px; 
}

h1 { margin-bottom:20px; }

.filtros {
  background:white;
  padding:14px;
  border-radius:12px;
  margin-bottom:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  display:flex;
  flex-direction:column;
  gap:8px;
}

.filtros input, .filtros button {
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.filtros button {
  border:none;
  cursor:pointer;
  color:white;
}

#btnFiltrar { background:#1976d2; }
#btnLimpar { background:#757575; }

.card {
  background:white;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:8px;
  cursor:pointer;
}

.btn-cancelar {
  background:#d32f2f;
  color:white;
}

.btn-voltar {
  background:#1976d2;
  color:white;
}

.paginacao {
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.paginacao button {
  width:48%;
  background:#1976d2;
  color:white;
}

.status { font-weight:bold; }
.motivo { color:#d32f2f; font-size:14px; margin-top:6px; }
</style>
</head>

<body>

<div class="container">

<h1>Minhas Vendas</h1>

<div class="filtros">
  <input type="date" id="filtroData">
  <input type="text" id="filtroCliente" placeholder="Nome do cliente">
  <input type="text" id="filtroPedido" placeholder="Número do pedido">
  <button id="btnFiltrar">Filtrar</button>
  <button id="btnLimpar">Limpar Filtros</button>
</div>

<div id="listaVendas"></div>

<div class="paginacao">
  <button id="btnAnterior">Anterior</button>
  <button id="btnProxima">Próxima</button>
</div>

<button class="btn-voltar" onclick="location.href='index.html'">
Voltar
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  getDocs, 
  doc, 
  updateDoc,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let todasVendas = [];
let vendasFiltradas = [];
let paginaAtual = 1;
const itensPorPagina = 5;

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  const q = query(
    collection(db, "vendas"),
    where("vendedorEmail", "==", user.email),
  );

  const snapshot = await getDocs(q);

  snapshot.forEach(docSnap => {
    todasVendas.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  todasVendas.sort((a, b) => {
    return new Date(b.dataPedido) - new
  Date(a.dataPedido);  
});

  vendasFiltradas = [...todasVendas];
  renderizarPagina();
});

function renderizarPagina() {

  const lista = document.getElementById("listaVendas");
  lista.innerHTML = "";

  const inicio = (paginaAtual - 1) * itensPorPagina;
  const fim = inicio + itensPorPagina;
  const pagina = vendasFiltradas.slice(inicio, fim);

  if (pagina.length === 0) {
    lista.innerHTML = "<p>Nenhuma venda encontrada.</p>";
    return;
  }

  pagina.forEach(venda => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>Pedido:</strong> ${venda.pedido || "-"}<br>
      <strong>Cliente:</strong> ${venda.cliente?.nome || "-"}<br>
      <strong>Total:</strong> R$ ${venda.total?.toFixed(2) || "0.00"}<br>
      <strong class="status">Status:</strong> ${venda.status}
    `;

    if (venda.status === "cancelado" && venda.motivoCancelamento) {
      div.innerHTML += `<div class="motivo">Motivo: ${venda.motivoCancelamento}</div>`;
    }

    if (venda.status !== "aprovado" && venda.status !== "cancelado") {

      const btn = document.createElement("button");
      btn.textContent = "Cancelar";
      btn.className = "btn-cancelar";

      btn.onclick = async () => {
        const motivo = prompt("Informe o motivo do cancelamento:");

        if (!motivo || motivo.trim() === "") {
          alert("Motivo obrigatório.");
          return;
        }

        await updateDoc(doc(db, "vendas", venda.id), {
          status: "cancelado",
          motivoCancelamento: motivo
        });

        alert("Venda cancelada com sucesso!");
        location.reload();
      };

      div.appendChild(btn);
    }

    lista.appendChild(div);
  });
}

document.getElementById("btnFiltrar").onclick = () => {

  const data = document.getElementById("filtroData").value;
  const cliente = document.getElementById("filtroCliente").value.toLowerCase();
  const pedido = document.getElementById("filtroPedido").value.toLowerCase();

  vendasFiltradas = todasVendas.filter(venda => {

    const matchCliente = venda.cliente?.nome?.toLowerCase().includes(cliente);
    const matchPedido = venda.pedido?.toLowerCase().includes(pedido);

    let matchData = true;

   if (data && venda.dataPedido) {
    matchData = venda.dataPedido === data;
}

    return matchCliente && matchPedido && matchData;
  });

  paginaAtual = 1;
  renderizarPagina();
};

document.getElementById("btnLimpar").onclick = () => {
  document.getElementById("filtroData").value = "";
  document.getElementById("filtroCliente").value = "";
  document.getElementById("filtroPedido").value = "";

  vendasFiltradas = [...todasVendas];
  paginaAtual = 1;
  renderizarPagina();
};

document.getElementById("btnAnterior").onclick = () => {
  if (paginaAtual > 1) {
    paginaAtual--;
    renderizarPagina();
  }
};

document.getElementById("btnProxima").onclick = () => {
  if (paginaAtual * itensPorPagina < vendasFiltradas.length) {
    paginaAtual++;
    renderizarPagina();
  }
};
</script>
</body>
</html>
