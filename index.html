<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Registro de Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:480px; margin:auto; padding:16px; }
h1,h2{margin:0 0 10px;}
label,input,textarea,select,button{width:100%;margin:6px 0;padding:12px;font-size:16px;border-radius:8px;}
input:disabled{background:#eee;}
textarea{resize:vertical;min-height:70px;}
button{background:#1976d2;color:white;border:none;cursor:pointer;}
button:active{background:#125aa0;}
.btn-excluir{background:#e53935;}
.card{background:white;padding:14px;border-radius:12px;margin-top:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.hidden{display:none;}
</style>
</head>

<body>
<div class="container">

<h1>Registro de Venda</h1>

<form id="formVenda">

<h2>Pedido</h2>
<input id="pedido" disabled>

<label>Data do Pedido</label>
<input type="date" id="dataPedido" required>

<label>Data da Entrega</label>
<input type="date" id="dataEntrega" required>

<label><input type="checkbox" id="montagem"> Montagem</label>

<hr>

<h2>Produto</h2>

<select id="modelo" required>
<option value="">Modelo do sofá</option>
<option>Sofá carina braço almofadado pilow de 15</option>
<option>Sofá carina braço almofadado pilow de 25</option>
<option>Sofá carina braço reto pilow de 15</option>
<option>Sofá carina braço reto pilow de 25</option>
</select>

<input id="tamanho" placeholder="Tamanho" required>
<input id="cor" placeholder="Cor" required>
<input id="valorSofa" placeholder="Valor do Sofá" required>
<input id="frete" placeholder="Frete" value="0">
<input id="valorMontagem" placeholder="Valor da Montagem" value="0">
<input id="total" placeholder="Total" disabled>

<hr>

<h2>Pagamento</h2>

<select id="formaPagamento" required>
<option value="">Forma de pagamento</option>
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão de Débito</option>
<option>Cartão de Crédito</option>
</select>

<div id="boxParcelas" class="hidden">
<input type="number" id="parcelas" placeholder="Quantidade de parcelas">
<input id="valorParcela" placeholder="Valor da parcela" disabled>
</div>

<hr>

<h2>Cliente</h2>
<input id="nomeCliente" placeholder="Nome" required>
<input id="contato" placeholder="Contato" required>

<input id="cep" placeholder="CEP" required>
<input id="rua" placeholder="Rua">
<input id="numero" placeholder="Número">
<input id="bairro" placeholder="Bairro">
<input id="cidade" placeholder="Cidade">

<textarea id="observacoes" placeholder="Observações do cliente"></textarea>

<button type="submit">Salvar Venda</button>
</form>

<h2>Minhas Vendas</h2>
<div id="listaVendas"></div>

<button id="btnSair">Sair</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let vendedor = {};

onAuthStateChanged(auth, user=>{
  if(!user) location.href="login.html";
  vendedor.nome = user.displayName;
  vendedor.email = user.email;
  carregarVendas();
});

btnSair.onclick=async()=>{
  await signOut(auth);
  location.href="login.html";
};

function moeda(i){
  let v=i.value.replace(/\D/g,"");
  v=(v/100).toFixed(2).replace(".",",");
  i.value="R$ "+v;
  totalizar();
}
function limpar(v){return Number(v.replace(/\D/g,""))/100||0;}
function totalizar(){
  total.value=(limpar(valorSofa.value)+limpar(frete.value)+(montagem.checked?limpar(valorMontagem.value):0))
  .toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  calcularParcela();
}

valorSofa.oninput=()=>moeda(valorSofa);
frete.oninput=()=>moeda(frete);
valorMontagem.oninput=()=>moeda(valorMontagem);
montagem.onchange=totalizar;

formaPagamento.onchange=()=>{
  boxParcelas.classList.toggle("hidden", formaPagamento.value!=="Cartão de Crédito");
};

parcelas.oninput=calcularParcela;
function calcularParcela(){
  if(parcelas.value>0){
    valorParcela.value=(limpar(total.value)/parcelas.value)
    .toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }
}

formVenda.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,"vendas"),{
    vendedorNome:vendedor.nome,
    vendedorEmail:vendedor.email,
    dataPedido:dataPedido.value,
    dataEntrega:dataEntrega.value,
    produto:{modelo:modelo.value,tamanho:tamanho.value,cor:cor.value,total:limpar(total.value)},
    pagamento:{
      forma:formaPagamento.value,
      parcelas:parcelas.value||1,
      valorParcela:limpar(valorParcela.value)
    },
    cliente:{
      nome:nomeCliente.value,
      contato:contato.value,
      cep:cep.value,
      rua:rua.value,
      numero:numero.value,
      bairro:bairro.value,
      cidade:cidade.value
    },
    observacoes:observacoes.value
  });
  formVenda.reset();
  carregarVendas();
};

async function carregarVendas(){
  listaVendas.innerHTML="";
  const q=query(collection(db,"vendas"),where("vendedorEmail","==",vendedor.email));
  const s=await getDocs(q);
  s.forEach(d=>{
    const v=d.data();
    listaVendas.innerHTML+=`
      <div class="card">
        <b>${v.produto.modelo}</b><br>
        Cliente: ${v.cliente.nome}<br>
        Total: R$ ${v.produto.total.toFixed(2)}
      </div>`;
  });
}
</script>
</body>
</html>
