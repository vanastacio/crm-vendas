<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#333}
.container{max-width:900px;margin:auto;padding:16px}
h1,h2{margin:10px 0}
input,select,textarea,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;font-size:14px}
button{background:#1976d2;color:#fff;border:none;cursor:pointer}
button:active{background:#125aa0}
.card{background:#fff;padding:12px;border-radius:8px;margin:8px 0}
.btn-excluir{background:#c62828;margin-top:6px}
.hidden{display:none}
.parcelas-btns button{width:auto;margin:4px}
</style>
</head>

<body>
<div class="container">
<h1>Nova Venda</h1>

<form id="formVenda">
<label>Pedido</label>
<input type="text" id="pedido" disabled>

<label>Data do Pedido</label>
<input type="date" id="dataPedido" required>

<label>Data de Entrega</label>
<input type="date" id="dataEntrega" required>

<label>Forma de Pagamento</label>
<select id="formaPagamento" required>
  <option value="">Selecione</option>
  <option value="avista">À vista</option>
  <option value="dinheiro">Dinheiro</option>
  <option value="pix">Pix</option>
  <option value="prazo">À prazo</option>
</select>

<div id="parcelasBox" class="hidden">
<label>Parcelas</label>
<div class="parcelas-btns" id="parcelasBtns"></div>
</div>

<h2>Produto</h2>
<input placeholder="Modelo do sofá" id="modelo" required>
<input placeholder="Tamanho" id="tamanho">
<input placeholder="Cor" id="cor">
<input placeholder="Valor total" id="total" required>

<h2>Cliente</h2>
<input placeholder="Nome do cliente" id="nomeCliente" required>
<input placeholder="Contato" id="contato">
<input placeholder="CEP" id="cep">
<input placeholder="Rua" id="rua">
<input placeholder="Número" id="numero">
<input placeholder="Bairro" id="bairro">
<input placeholder="Cidade" id="cidade">
<textarea placeholder="Observações do cliente" id="observacao"></textarea>

<button type="submit">Salvar Venda</button>
</form>

<h2>Minhas Vendas</h2>
<div id="listaVendas"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const vendedor = {};
let parcelasSelecionadas = 1;

function gerarNumeroPedido(){
  return "PED" + Date.now();
}

onAuthStateChanged(auth, user=>{
  if(!user) location.href="login.html";
  vendedor.nome = user.displayName || user.email;
  vendedor.email = user.email;
  pedido.value = gerarNumeroPedido();
  carregarVendas();
});

const formaPagamento = document.getElementById("formaPagamento");
const parcelasBox = document.getElementById("parcelasBox");
const parcelasBtns = document.getElementById("parcelasBtns");

formaPagamento.addEventListener("change", ()=>{
  parcelasBox.classList.toggle("hidden", formaPagamento.value!=="prazo");
  parcelasBtns.innerHTML="";
  parcelasSelecionadas = 1;

  if(formaPagamento.value==="prazo"){
    for(let i=1;i<=12;i++){
      const b=document.createElement("button");
      b.type="button";
      b.textContent=i+"x";
      b.onclick=()=>parcelasSelecionadas=i;
      parcelasBtns.appendChild(b);
    }
  }
});

formVenda.addEventListener("submit", async e=>{
  e.preventDefault();

  await addDoc(collection(db,"vendas"),{
    pedido: pedido.value,
    vendedorNome:vendedor.nome,
    vendedorEmail:vendedor.email,
    dataPedido:dataPedido.value,
    dataEntrega:dataEntrega.value,
    pagamento:formaPagamento.value,
    parcelas: parcelasSelecionadas,
    status:"pendente",
    produto:{
      modelo:modelo.value,
      tamanho:tamanho.value,
      cor:cor.value,
      total:Number(total.value.replace(",","."))||0
    },
    cliente:{
      nome:nomeCliente.value,
      contato:contato.value,
      cep:cep.value,
      rua:rua.value,
      numero:numero.value,
      bairro:bairro.value,
      cidade:cidade.value,
      observacao:observacao.value
    }
  });

  formVenda.reset();
  pedido.value = gerarNumeroPedido();
  carregarVendas();
});

async function carregarVendas(){
  listaVendas.innerHTML="";
  const q=query(collection(db,"vendas"),where("vendedorEmail","==",vendedor.email));
  const snap=await getDocs(q);

  snap.forEach(d=>{
    const v=d.data();
    listaVendas.innerHTML+=`
      <div class="card">
        <b>Pedido: ${v.pedido}</b><br>
        <b>${v.produto.modelo}</b><br>
        Cliente: ${v.cliente.nome} (${v.cliente.contato||""})<br>
        Pagamento: ${v.pagamento} ${v.pagamento==="prazo"?v.parcelas+"x":""}<br>
        Pedido: ${v.dataPedido} | Entrega: ${v.dataEntrega}<br>
        Total: R$ ${v.produto.total.toFixed(2)}<br>
        <button class="btn-excluir" onclick="excluir('${d.id}')">Excluir</button>
      </div>`;
  });
}

window.excluir = async id=>{
  if(confirm("Excluir venda?")){
    await deleteDoc(doc(db,"vendas",id));
    carregarVendas();
  }
};
</script>
</body>
</html>
