<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Registro de Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:480px; margin:auto; padding:16px; }
h1,h2{margin:0 0 10px;}
label,input,textarea,select,button{width:100%;margin:6px 0;padding:12px;font-size:16px;border-radius:8px;}
input:disabled{background:#eee;}
textarea{resize:vertical;min-height:60px;}
button{background:#1976d2;color:white;border:none;cursor:pointer;}
button:active{background:#125aa0;}
.card{background:white;padding:14px;border-radius:12px;margin-top:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.parcelas{display:none;gap:6px;flex-wrap:wrap;}
.parcelas button{width:auto;padding:8px 12px;background:#eee;color:#333;}
.parcelas button.ativa{background:#1976d2;color:#fff;}
</style>
</head>

<body>
<div class="container">

<h1>Registro de Venda</h1>

<form id="formVenda">

<label>Nº do Pedido</label>
<input id="pedido" disabled>

<label>Data do Pedido</label>
<input type="date" id="dataPedido" required>

<label>Data da Entrega</label>
<input type="date" id="dataEntrega" required>

<label><input type="checkbox" id="montagem"> Montagem</label>

<hr>

<label>Modelo do Sofá</label>
<select id="modelo" required>
<option value="">Selecione</option>
<option>Sofá carina braço almofadado pilow de 15</option>
<option>Sofá carina braço almofadado pilow de 25</option>
<option>Sofá carina braço reto pilow de 15</option>
<option>Sofá carina braço reto pilow de 25</option>
</select>

<label>Tamanho do Sofá</label>
<input id="tamanho" required>

<label>Cor</label>
<input id="cor" required>

<label>Valor do Sofá</label>
<input id="valorSofa" required>

<label>Frete</label>
<input id="frete" value="0">

<label>Valor da Montagem</label>
<input id="valorMontagem" value="0">

<label>Total</label>
<input id="total" disabled>

<hr>

<label>Forma de Pagamento</label>
<select id="pagamento" required>
<option value="">Selecione</option>
<option value="avista">À vista</option>
<option value="dinheiro">Dinheiro</option>
<option value="pix">Pix</option>
<option value="prazo">A prazo</option>
</select>

<div class="parcelas" id="parcelas"></div>

<hr>

<input placeholder="Nome do Cliente" id="nomeCliente" required>
<input placeholder="Contato" id="contato" required>

<input placeholder="CEP" id="cep" required>
<input placeholder="Rua" id="rua">
<input placeholder="Número" id="numero">
<input placeholder="Bairro" id="bairro">
<input placeholder="Município" id="cidade">

<textarea placeholder="Observações" id="obs"></textarea>

<button type="submit">Salvar Venda</button>
</form>

<button id="btnSair">Sair</button>

<div class="card">
  <h2>Minhas Vendas</h2>
  <div id="minhasVendas"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  where, 
  getDocs, 
  doc, 
  updateDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let vendedor = {};
let parcelaSelecionada = null;

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.replace("login.html");
    return;
  }

  vendedor.nome = user.displayName;
  vendedor.email = user.email;

  carregarMinhasVendas();

});

pedido.value = Date.now();
dataPedido.valueAsDate = new Date();

function moeda(i){
  let v=i.value.replace(/\D/g,"");
  v=(v/100).toFixed(2);
  v=v.replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
  i.value="R$ "+v;
  totalizar();
}
function limpar(v){ return Number(v.replace(/\D/g,""))/100||0; }
function totalizar(){
  total.value=(limpar(valorSofa.value)+limpar(frete.value)+(montagem.checked?limpar(valorMontagem.value):0))
  .toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
valorSofa.oninput=()=>moeda(valorSofa);
frete.oninput=()=>moeda(frete);
valorMontagem.oninput=()=>moeda(valorMontagem);
montagem.onchange=totalizar;

pagamento.onchange=()=>{
  parcelas.innerHTML="";
  parcelaSelecionada=null;
  if(pagamento.value==="prazo"){
    parcelas.style.display="flex";
    for(let i=1;i<=12;i++){
      const b=document.createElement("button");
      b.type="button";
      b.textContent=i+"x";
      b.onclick=()=>{
        document.querySelectorAll(".parcelas button").forEach(x=>x.classList.remove("ativa"));
        b.classList.add("ativa");
        parcelaSelecionada=i;
      };
      parcelas.appendChild(b);
    }
  } else {
    parcelas.style.display="none";
  }
};

formVenda.onsubmit=async e=>{
  e.preventDefault();

  if(pagamento.value==="prazo" && !parcelaSelecionada){
    alert("Selecione a quantidade de parcelas");
    return;
  }

  await addDoc(collection(db,"vendas"),{
    pedido:pedido.value,
    status:"pendente",
    vendedorNome:vendedor.nome,
    vendedorEmail:vendedor.email,
    dataPedido:dataPedido.value,
    dataEntrega:dataEntrega.value,
    produto:{
      modelo:modelo.value,
      tamanho:tamanho.value,
      cor:cor.value,
      valor:limpar(valorSofa.value)
    },
    pagamento:{
      tipo:pagamento.value,
      parcelas:parcelaSelecionada
    },
    total:limpar(total.value),
    cliente:{
      nome:nomeCliente.value,
      contato:contato.value,
      cep:cep.value,
      rua:rua.value,
      numero:numero.value,
      bairro:bairro.value,
      cidade:cidade.value
    },
    observacoes:obs.value
  });

  alert("Venda salva");
  formVenda.reset();
  pedido.value = Date.now();
  dataPedido.valueAsDate = new Date();
  carregarMinhasVendas();
};

async function carregarMinhasVendas(){
  const lista = document.getElementById("minhasVendas");
  lista.innerHTML="Carregando...";

  const q = query(
    collection(db,"vendas"),
    where("vendedorEmail","==",vendedor.email)
  );

  const snapshot = await getDocs(q);

  if(snapshot.empty){
    lista.innerHTML="Nenhuma venda encontrada.";
    return;
  }

  lista.innerHTML="";

  snapshot.forEach(docSnap=>{
    const v = docSnap.data();

    const valorFormatado = (v.total||0).toLocaleString("pt-BR",{
      style:"currency",
      currency:"BRL"
    });

    lista.innerHTML+=`
      <div style="border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:8px;">
        <strong>Pedido:</strong> ${v.pedido}<br>
        <strong>Cliente:</strong> ${v.cliente?.nome||""}<br>
        <strong>Valor:</strong> ${valorFormatado}<br>
        <strong>Status:</strong> ${v.status}
        ${v.status==="pendente"
          ? `<br><button onclick="cancelarVenda('${docSnap.id}')">Cancelar</button>`
          : ""
        }
      </div>
    `;
  });
}

window.cancelarVenda = async (id)=>{
  const motivo = prompt("Informe o motivo do cancelamento:");
  if(!motivo || motivo.trim()===""){
    alert("Motivo obrigatório.");
    return;
  }

  await updateDoc(doc(db,"vendas",id),{
    status:"cancelado",
    motivoCancelamento:motivo
  });

  carregarMinhasVendas();
};

btnSair.onclick=async()=>{
  await signOut(auth);
  location.href="login.html";
};
</script>
</body>
</html>
