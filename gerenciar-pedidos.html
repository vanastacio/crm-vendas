<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:1000px; margin:auto; padding:16px; }
h1,h2 { margin-bottom:12px; }
.card {
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  margin-bottom:12px;
}
.btn-aprovar { background:#2e7d32; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
.btn-reprovar { background:#c62828; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; margin-left:8px; }
.status-aprovado { color:#2e7d32; font-weight:bold; }
.status-reprovado { color:#c62828; font-weight:bold; }
.voltar { margin-bottom:16px; }
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<h2>Pedidos Pendentes de Aprovação</h2>
<div id="pendentes"></div>

<h2>Status do Pedido</h2>
<div id="finalizados"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const pendentesDiv = document.getElementById("pendentes");
const finalizadosDiv = document.getElementById("finalizados");

function formatarPagamento(p) {
  if (!p) return "Não informado";
  if (p.tipo === "prazo") return `${p.parcelas || 1}x`;
  return p.tipo;
}

function obterValorVenda(v) {
  return (
    v.produto?.total ??
    v.produto?.valor ??
    v.valorTotal ??
    v.total ??
    0
  );
}

function formatarValor(v) {
  return Number(v || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

async function carregarPedidos() {
  pendentesDiv.innerHTML = "";
  finalizadosDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "vendas"));

  snapshot.forEach(docSnap => {
    const v = docSnap.data();
    const status = v.status || "pendente";
    const valorVenda = obterValorVenda(v);

    const html = `
      <div class="card">
        <b>Pedido:</b> ${v.pedido}<br>
        <b>Modelo:</b> ${v.produto?.modelo || "-"}<br>
        <b>Cliente:</b> ${v.cliente?.nome || "-"}<br>
        <b>Vendedor:</b> ${v.vendedorNome || "-"}<br>
        <b>Entrega:</b> ${v.dataEntrega || "-"}<br>
        <b>Pagamento:</b> ${formatarPagamento(v.pagamento)}<br>
        <b>Valor:</b> ${formatarValor(valorVenda)}
        ${status === "pendente" ? `
          <div style="margin-top:10px;">
            <button class="btn-aprovar" onclick="atualizarStatus('${docSnap.id}','aprovado')">Aprovar</button>
            <button class="btn-reprovar" onclick="reprovarPedido('${docSnap.id}')">Reprovar</button>

          </div>
        ` : `
          <div style="margin-top:10px;">
            <span class="status-${status}">${status.toUpperCase()}</span>
          </div>
        `}
      </div>
    `;

    if (status === "pendente") {
      pendentesDiv.innerHTML += html;
    } else {
      finalizadosDiv.innerHTML += html;
    }
  });
}

  window.atualizarStatus = async (id, status) => {
  await updateDoc(doc(db, "vendas", id), { status });
  carregarPedidos();
};


  window.reprovarPedido = async (id) => {
  const motivo = prompt("Informe o motivo da reprovação:");
  if (!motivo || motivo.trim() === "") {
    alert("A reprovação exige um motivo.");
    return;
  }

  await atualizarStatus(id, "reprovado", motivo);
};
  
</script>

</body>
</html>
