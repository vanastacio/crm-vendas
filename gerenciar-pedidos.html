<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:900px; margin:auto; padding:16px; }
h1,h2{margin-bottom:12px;}
.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-right:6px;
}
.aprovar{background:#2e7d32;color:#fff;}
.reprovar{background:#c62828;color:#fff;}
.status{font-weight:bold;}
.voltar{
  background:#1976d2;
  color:#fff;
  margin-bottom:16px;
}
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">← Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<h2>Pedidos Pendentes de Aprovação</h2>
<div id="pendentes"></div>

<h2>Status do Pedido</h2>
<div id="statusPedidos"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user=>{
  if(!user) location.href="login.html";
  carregarPedidos();
});

async function carregarPedidos(){
  pendentes.innerHTML="";
  statusPedidos.innerHTML="";

  const snap = await getDocs(collection(db,"vendas"));

  snap.forEach(d=>{
    const v = d.data();
    const div = document.createElement("div");
    div.className="card";

    const parcelas = v.pagamento?.parcelas ? `${v.pagamento.parcelas}x` : "";
    const valor = v.produto?.total
      ? v.produto.total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
      : "R$ 0,00";

    div.innerHTML = `
      <div><b>Pedido:</b> ${v.pedido}</div>
      <div><b>Modelo:</b> ${v.produto?.modelo || "-"}</div>
      <div><b>Cliente:</b> ${v.cliente?.nome || "-"}</div>
      <div><b>Vendedor:</b> ${v.vendedorNome || "-"}</div>
      <div><b>Pagamento:</b> ${v.pagamento?.tipo || "-"} ${parcelas}</div>
      <div><b>Valor:</b> ${valor}</div>
      <div><b>Status:</b> <span class="status">${v.status || "pendente"}</span></div>
      ${v.motivoReprovacao ? `<div><b>Motivo:</b> ${v.motivoReprovacao}</div>` : ""}
    `;

    if(!v.status || v.status === "pendente"){
      const btnAprovar = document.createElement("button");
      btnAprovar.textContent = "Aprovar";
      btnAprovar.className="aprovar";
      btnAprovar.onclick = async ()=>{
        await updateDoc(doc(db,"vendas",d.id),{ status:"aprovado" });
        carregarPedidos();
      };

      const btnReprovar = document.createElement("button");
      btnReprovar.textContent = "Reprovar";
      btnReprovar.className="reprovar";
      btnReprovar.onclick = async ()=>{
        const motivo = prompt("Informe o motivo da reprovação:");
        if(!motivo) return;
        await updateDoc(doc(db,"vendas",d.id),{
          status:"reprovado",
          motivoReprovacao: motivo
        });
        carregarPedidos();
      };

      div.appendChild(btnAprovar);
      div.appendChild(btnReprovar);
      pendentes.appendChild(div);
    } else {
      statusPedidos.appendChild(div);
    }
  });
}
</script>

</body>
</html>
