<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:1000px; margin:auto; padding:16px; }
h1,h2 { margin-bottom:12px; }

.card {
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  margin-bottom:12px;
}

.btn-aprovar {
  background:#2e7d32;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.btn-reprovar {
  background:#c62828;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  margin-left:8px;
}

.voltar { margin-bottom:16px; }

.paginacao {
  text-align:center;
  margin-top:10px;
}

.paginacao button {
  padding:6px 10px;
  margin:0 5px;
}
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<h2 id="tituloLista">Pedidos Pendentes</h2>

<div style="margin-bottom:15px;">
  <button onclick="mudarFiltro('pendente')">Pendentes</button>
  <button onclick="mudarFiltro('aprovado')">Aprovados</button>
  <button onclick="mudarFiltro('reprovado')">Reprovados</button>
  <button onclick="mudarFiltro('todos')">Todos</button>
</div>

<div id="pendentes"></div>

<div class="paginacao">
  <button onclick="paginaAnterior()">⬅ Anterior</button>
  <button onclick="proximaPagina()">Próxima ➡</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query, 
  orderBy, 
  limit, 
  startAfter, 
  getDocs, 
  updateDoc, 
  doc, 
  where 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { 
  getAuth, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

// 🔥 PRIMEIRO inicializa o app
const app = initializeApp(firebaseConfig);

// 🔥 DEPOIS cria as instâncias
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    console.log("Usuário não autenticado.");
    return; // não redireciona
  }

  carregarPedidos();
});
  
const pendentesDiv = document.getElementById("pendentes");

let ultimoDoc = null;
const limitePagina = 10;
let statusAtual = "ativa";

function formatarValor(v) {
  return Number(v || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function obterValorVenda(v) {
  return (
    v.produto?.total ??
    v.produto?.valor ??
    v.valor ??
    v.total ??
    0
  );
}

async function carregarPedidos(direcao = "primeira") {

  pendentesDiv.innerHTML = "Carregando...";

  let q;

  if (direcao === "proxima" && ultimoDoc) {

    if (statusAtual === "todos") {
      q = query(
        collection(db, "vendas"),
        orderBy("dataPedido", "desc"),
        startAfter(ultimoDoc),
        limit(limitePagina)
      );
    } else {
      q = query(
        collection(db, "vendas"),
        where("status", "==", statusAtual),
        orderBy("dataPedido", "desc"),
        startAfter(ultimoDoc),
        limit(limitePagina)
      );
    }

  } else {

    if (statusAtual === "todos") {
      q = query(
        collection(db, "vendas"),
        orderBy("dataPedido", "desc"),
        limit(limitePagina)
      );
    } else {
      q = query(
        collection(db, "vendas"),
        where("status", "==", statusAtual),
        orderBy("dataPedido", "desc"),
        limit(limitePagina)
      );
    }

  }

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    pendentesDiv.innerHTML = "Nenhum pedido encontrado.";
    return;
  }

  ultimoDoc = snapshot.docs[snapshot.docs.length - 1];
  pendentesDiv.innerHTML = "";

  snapshot.forEach(docSnap => {
    const v = docSnap.data();
    const valor = obterValorVenda(v);

    pendentesDiv.innerHTML += `
      <div class="card">
        <b>Pedido:</b> ${v.pedido || "-"}<br>
        <b>Cliente:</b> ${v.cliente?.nome || "-"}<br>
        <b>Vendedor:</b> ${v.vendedorNome || "-"}<br>
        <b>Entrega:</b> ${v.dataEntrega || "-"}<br>
        <b>Valor:</b> ${formatarValor(valor)}
        <div style="margin-top:10px;">
          ${statusAtual === "pendente" ? `
          <button class="btn-aprovar" onclick="aprovar('${docSnap.id}')">Aprovar</button>
          <button class="btn-reprovar" onclick="reprovar('${docSnap.id}')">Reprovar</button>
          ` : ""}
        </div>
      </div>
    `;
  });
}

window.mudarFiltro = (novoStatus) => {
  statusAtual = novoStatus;
  ultimoDoc = null;

  const titulo = document.getElementById("tituloLista");

  if (novoStatus === "pendente") titulo.innerText = "Pedidos Pendentes";
  if (novoStatus === "aprovado") titulo.innerText = "Pedidos Aprovados";
  if (novoStatus === "reprovado") titulo.innerText = "Pedidos Reprovados";
  if (novoStatus === "todos") titulo.innerText = "Todos os Pedidos";

  carregarPedidos();
};

window.proximaPagina = () => {
  carregarPedidos("proxima");
};

window.paginaAnterior = () => {
  ultimoDoc = null;
  carregarPedidos();
};

window.aprovar = async (id) => {
  await updateDoc(doc(db, "vendas", id), { status: "aprovado" });
  ultimoDoc = null;
  carregarPedidos();
};

window.reprovar = async (id) => {
  const motivo = prompt("Informe o motivo da reprovação:");
  if (!motivo || motivo.trim() === "") {
    alert("A reprovação exige um motivo.");
    return;
  }

  await updateDoc(doc(db, "vendas", id), { 
    status: "reprovado",
    motivoReprovacao: motivo
  });

  ultimoDoc = null;
  carregarPedidos();
};

</script>
</body>
</html>
