<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>

<style>

/* ===== FUNDO IGUAL INDEX ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: url("fundo.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

/* ===== TOPO ===== */
.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
}

.titulo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  flex:1;
}

.btn-topo{
  border:2px solid white;
  padding:8px 18px;
  border-radius:25px;
  cursor:pointer;
  transition:.2s;
}

.btn-topo:hover{
  background:white;
  color:black;
}

/* ===== FILTRO ===== */

.filtro-container{
  text-align:center;
  margin-top:15px;
}

.filtro-select,
.filtro-input{
  padding:10px 15px;
  border-radius:20px;
  border:none;
  margin:5px;
  outline:none;
}

.btn-filtrar{
  padding:10px 20px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  background:white;
  font-weight:bold;
  transition:.2s;
}

.btn-filtrar:hover{
  transform:scale(1.05);
}

/* ===== GRID ===== */
.cards-container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
  padding:40px;
}

/* ===== CARD ===== */
.card-pedido{
  background:white;
  color:black;
  border-radius:15px;
  padding:15px;
  cursor:pointer;
  transition:all .25s ease;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  position:relative;
}

.card-pedido:hover{
  transform:scale(1.05) rotate(.5deg);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card-expandido{
  grid-column:span 2;
  background:#f2f2f2;
}

/* ===== PAGINAÇÃO ===== */
.paginacao{
  text-align:center;
  margin:30px;
}

.paginacao button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* ===== NOTIFICAÇÃO ===== */
.notificacao{
  position:relative;
}

.badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background:red;
  color:white;
  font-size:12px;
  border-radius:50%;
  padding:4px 8px;
}
/* ===== STATUS VISUAL DOS CARDS ===== */

.card-ativo{
  background: linear-gradient(135deg, #1e88e5, #1565c0);
  color:#fff;
}

.card-producao{
  background: linear-gradient(135deg, #f9a825, #f57f17);
  color:#000;
}

.card-entregue{
  background: linear-gradient(135deg, #43a047, #2e7d32);
  color:#fff;
}

.card-ativo b,
.card-producao b,
.card-entregue b{
  color:inherit;
}

/* etiqueta de status */
.tag-status{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background: rgba(255,255,255,0.25);
}
  
</style>
</head>
<body>

<div class="topo">
  <div class="btn-topo" onclick="window.location.href='jader.html'">Voltar</div>
  <div class="titulo">GERENCIAR PEDIDOS</div>
  <div class="btn-topo notificacao" onclick="limparNotificacao()">
    🔔
    <span id="badge" class="badge" style="display:none;">0</span>
  </div>
</div>

<div class="filtro-container">

  <select id="tipoFiltro" class="filtro-select">
    <option value="">Filtrar por...</option>
    <option value="pedido">Número do Pedido</option>
    <option value="vendedor">Vendedor</option>
    <option value="data">Data do Pedido</option>
  </select>

  <input 
    id="campoFiltro"
    class="filtro-input"
    placeholder="Selecione um filtro acima"
    style="display:none;"
  >

  <select id="filtroZona" class="filtro-select">
  <option value="">Filtrar por Zona</option>
  <option value="centro">Centro</option>
  <option value="zona_norte">Zona Norte</option>
  <option value="zona_sul">Zona Sul</option>
  <option value="zona_leste">Zona Leste</option>
  <option value="zona_oeste">Zona Oeste</option>
  <option value="abc_paulista">ABC Paulista</option>
  <option value="litoral_sul">Litoral Sul</option>
  <option value="litoral_norte">Litoral Norte</option>
  <option value="sudoeste">Sudoeste</option>
  <option value="interior">Interior</option>
</select>

</div>

<div id="pendentes" class="cards-container"></div>

<div class="paginacao">
  <button onclick="paginaAnterior()">Anterior</button>
  <button onclick="proximaPagina()">Próxima</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  startAfter,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let ultimoDoc = null;
const limitePagina = 12;
let vendasCache = [];
let contadorNotificacao = 0;

/* ===== LOGIN ===== */
onAuthStateChanged(auth, (user)=>{
  if(!user) return;
  carregarPedidos();
  ativarNotificacaoTempoReal();
});

/* ===== FORMATAR ===== */
function formatarValor(v){
  return Number(v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

  function formatarZona(z){
  const map = {
    centro: "Centro",
    zona_norte: "Zona Norte",
    zona_sul: "Zona Sul",
    zona_leste: "Zona Leste",
    zona_oeste: "Zona Oeste",
    abc_paulista: "ABC Paulista",
    litoral_sul: "Litoral Sul",
    litoral_norte: "Litoral Norte",
    sudoeste: "Sudoeste",
    interior: "Interior"
  };
  return map[z] || "-";
}

function calcularTotal(v){
  const produto = v.produto?.valor ?? 0;
  const frete = v.frete ?? 0;
  const montagem = v.montagem ?? 0;
  return produto + frete + montagem;
}

/* ===== CARREGAR ===== */
async function carregarPedidos(direcao="primeira"){

  const pendentesDiv = document.getElementById("pendentes");
  pendentesDiv.innerHTML = "Carregando...";

  let q;

  if(direcao==="proxima" && ultimoDoc){
    q = query(
      collection(db,"vendas"),
      orderBy("dataPedido","desc"),
      startAfter(ultimoDoc),
      limit(limitePagina)
    );
  }else{
    q = query(
      collection(db,"vendas"),
      orderBy("dataPedido","desc"),
      limit(limitePagina)
    );
  }

  const snapshot = await getDocs(q);

  if(snapshot.empty){
    pendentesDiv.innerHTML="Nenhum pedido encontrado.";
    return;
  }

  ultimoDoc = snapshot.docs[snapshot.docs.length-1];

  vendasCache = snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));

  renderizarCards(vendasCache);
}

/* ===== RENDER ===== */
function renderizarCards(lista){

  const pendentesDiv = document.getElementById("pendentes");
  pendentesDiv.innerHTML="";

  lista.forEach(v=>{

    const total = calcularTotal(v);

    const classeStatus =
      v.status === "producao" ? "card-producao" :
      v.status === "entregue" ? "card-entregue" :
      "card-ativo";

    pendentesDiv.innerHTML+=`
      <div class="card-pedido ${classeStatus}" onclick="expandirCard(this)">
        <b>Pedido:</b> ${v.pedido}<br>
        <b>Vendedor:</b> ${v.vendedorNome}<br>
        <b>Entrega:</b> ${v.dataEntrega}<br>
        <b>Valor:</b> ${formatarValor(total)}
        <div class="detalhes" style="display:none;margin-top:10px;">
          <hr>
          <b>Modelo:</b> ${v.produto?.modelo}<br>
          <b>Cor:</b> ${v.produto?.cor}<br>
          <b>Tamanho:</b> ${v.produto?.tamanho}<br>
          <b>Zona:</b> ${formatarZona(v.zona)}<br>
          <b>Status:</b> ${v.status}<br>
          <b>Observações:</b> ${v.observacoes || "-"}
          <br><br>
           
         ${
  v.status !== "producao" && v.status !== "entregue"
    ? `<button class="btn-producao"
        onclick="event.stopPropagation(); enviarParaProducao('${v.id}')">
        Enviar para Produção
      </button>`
    : (v.status === "producao"
        ? `<span class="tag-status tag-producao">Em produção</span>`
        : `<span class="tag-status tag-entregue">Entregue</span>`
      )
}
           
        </div>
      </div>
    `;
  });
}
  
/* ===== EXPANSÃO ===== */
window.expandirCard=(card)=>{

  const detalhes = card.querySelector(".detalhes");
  const expandido = card.classList.contains("card-expandido");

  document.querySelectorAll(".card-pedido").forEach(c=>{
    c.classList.remove("card-expandido");
    c.querySelector(".detalhes").style.display="none";
  });

  if(!expandido){
    card.classList.add("card-expandido");
    detalhes.style.display="block";
  }
};

/* ===== FILTRO INTELIGENTE ===== */
const tipoFiltro = document.getElementById("tipoFiltro");
const campoFiltro = document.getElementById("campoFiltro");
const filtroZona = document.getElementById("filtroZona");

tipoFiltro.onchange = () => {

  campoFiltro.value = "";

  if(!tipoFiltro.value){
    campoFiltro.style.display = "none";
    renderizarCards(vendasCache);
    return;
  }

  campoFiltro.style.display = "inline-block";

  if(tipoFiltro.value === "data"){
    campoFiltro.type = "date";
  } 
  else if(tipoFiltro.value === "pedido"){
    campoFiltro.type = "number";
  }
  else {
    campoFiltro.type = "text";
  }
};

campoFiltro.oninput = () => {

  const valor = campoFiltro.value.toLowerCase();

  if(!valor){
    renderizarCards(vendasCache);
    return;
  }

  let filtrado = [];

  if(tipoFiltro.value === "pedido"){
    filtrado = vendasCache.filter(v =>
      v.pedido === valor
    );
  }

  if(tipoFiltro.value === "cliente"){
    filtrado = vendasCache.filter(v =>
      v.cliente?.nome?.toLowerCase().includes(valor)
    );
  }

  if(tipoFiltro.value === "vendedor"){
    filtrado = vendasCache.filter(v =>
      v.vendedorNome?.toLowerCase().includes(valor)
    );
  }

  if(tipoFiltro.value === "data"){
    filtrado = vendasCache.filter(v =>
      v.dataPedido === valor
    );
  }

  renderizarCards(filtrado);
};

  filtroZona.onchange = () => {

  const zonaSelecionada = filtroZona.value;

  if(!zonaSelecionada){
    renderizarCards(vendasCache);
    return;
  }

  const filtrado = vendasCache.filter(v =>
    v.zona === zonaSelecionada
  );

  renderizarCards(filtrado);
};

/* ===== PAGINAÇÃO ===== */
window.proximaPagina=()=>carregarPedidos("proxima");
window.paginaAnterior=()=>{
  ultimoDoc=null;
  carregarPedidos();
};

/* ===== NOTIFICAÇÃO REALTIME ===== */
function ativarNotificacaoTempoReal(){
  onSnapshot(collection(db,"vendas"),()=>{
    contadorNotificacao++;
    const badge = document.getElementById("badge");
    badge.style.display="block";
    badge.innerText=contadorNotificacao;
  });
}
window.limparNotificacao = () => {
  contadorNotificacao = 0;
  const badge = document.getElementById("badge");
  badge.style.display = "none";
};

/* ✅ AQUI SIM — PASSO 4 */
window.enviarParaProducao = async (id) => {
  const confirmar = confirm("Deseja enviar este pedido para PRODUÇÃO?");
  if (!confirmar) return;

  await updateDoc(doc(db, "vendas", id), {
    status: "producao"
  });

  alert("Pedido enviado para produção!");
  carregarPedidos();
};
  
</script>
</body>
</html>
