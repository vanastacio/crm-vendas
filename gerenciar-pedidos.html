<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{max-width:900px;margin:auto;padding:16px}
h1{margin-bottom:10px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.badge{padding:4px 10px;border-radius:12px;font-size:13px;color:#fff}
.pendente{background:#f9a825}
.aprovado{background:#2e7d32}
.reprovado{background:#c62828}
button{padding:8px 12px;border:none;border-radius:6px;margin-right:6px;cursor:pointer}
.aprovar{background:#2e7d32;color:#fff}
.reprovar{background:#c62828;color:#fff}
.voltar{background:#1976d2;color:#fff;margin-bottom:12px}
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<div id="lista"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");

function formatarPagamento(p){
  if(!p) return "Não informado";
  if(p.tipo === "prazo") return `A prazo (${p.parcelas}x)`;
  if(p.tipo === "avista") return "À vista";
  if(p.tipo === "pix") return "Pix";
  if(p.tipo === "dinheiro") return "Dinheiro";
  return p.tipo;
}

function moeda(v){
  return Number(v || 0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

async function carregarPedidos(){
  lista.innerHTML="";
  const snap = await getDocs(collection(db,"vendas"));

  snap.forEach(d=>{
    const v = d.data();

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <div>
        <span class="badge ${v.status}">${v.status.toUpperCase()}</span>
      </div>
      <p><b>Pedido:</b> ${v.pedido}</p>
      <p><b>Vendedor:</b> ${v.vendedorNome}</p>
      <p><b>Cliente:</b> ${v.cliente.nome}</p>
      <p><b>Modelo do Sofá:</b> ${v.produto.modelo}</p>
      <p><b>Entrega:</b> ${v.dataEntrega}</p>
      <p><b>Pagamento:</b> ${formatarPagamento(v.pagamento)}</p>
      <p><b>Valor:</b> ${moeda(v.total)}</p>

      <button class="aprovar">Aprovar</button>
      <button class="reprovar">Reprovar</button>
    `;

    card.querySelector(".aprovar").onclick = async ()=>{
      await updateDoc(doc(db,"vendas",d.id),{status:"aprovado"});
      carregarPedidos();
    };

    card.querySelector(".reprovar").onclick = async ()=>{
      const motivo = prompt("Motivo da reprovação:");
      if(!motivo) return;
      await updateDoc(doc(db,"vendas",d.id),{
        status:"reprovado",
        motivoReprovacao:motivo
      });
      carregarPedidos();
    };

    lista.appendChild(card);
  });
}

carregarPedidos();
</script>

</body>
</html>
