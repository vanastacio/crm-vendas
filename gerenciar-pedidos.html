<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:1000px; margin:auto; padding:16px; }
h1,h2 { margin-bottom:12px; }
.card {
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  margin-bottom:12px;
}
.btn-aprovar { background:#2e7d32; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
.btn-reprovar { background:#c62828; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; margin-left:8px; }
.status-aprovado { color:#2e7d32; font-weight:bold; }
.status-reprovado { color:#c62828; font-weight:bold; }
.voltar { margin-bottom:16px; }
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<h2>Pedidos Pendentes de Aprovação</h2>
<div id="pendentes"></div>

<h2>Status do Pedido</h2>
<div id="finalizados"></div>

</div>

<script type="module">
import { 
  initializeApp 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { 
  getFirestore, 
  collection, 
  query, 
  orderBy, 
  limit, 
  startAfter, 
  getDocs, 
  updateDoc, 
  doc,
  where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const pendentesDiv = document.getElementById("pendentes");
const finalizadosDiv = document.getElementById("finalizados");

let ultimoDoc = null;
let paginaAtual = 1;
const limitePagina = 10;

async function carregarPedidos(statusFiltro = "pendente") {

  pendentesDiv.innerHTML = "Carregando...";
  finalizadosDiv.innerHTML = "";

  let q = query(
    collection(db, "vendas"),
    where("status", "==", statusFiltro),
    orderBy("dataPedido", "desc"),
    limit(limitePagina)
  );

  if (ultimoDoc) {
    q = query(
      collection(db, "vendas"),
      where("status", "==", statusFiltro),
      orderBy("dataPedido", "desc"),
      startAfter(ultimoDoc),
      limit(limitePagina)
    );
  }

  const snapshot = await getDocs(q);

  pendentesDiv.innerHTML = "";

  if (snapshot.empty) {
    pendentesDiv.innerHTML = "Nenhum pedido encontrado.";
    return;
  }

  ultimoDoc = snapshot.docs[snapshot.docs.length - 1];

  snapshot.forEach(docSnap => {
    const v = docSnap.data();
    const valor = obterValorVenda(v);

    pendentesDiv.innerHTML += `
      <div class="card">
        <b>Pedido:</b> ${v.pedido}<br>
        <b>Cliente:</b> ${v.cliente?.nome || "-"}<br>
        <b>Valor:</b> ${formatarValor(valor)}
        <div style="margin-top:10px;">
          <button class="btn-aprovar" onclick="aprovar('${docSnap.id}')">Aprovar</button>
          <button class="btn-reprovar" onclick="reprovar('${docSnap.id}')">Reprovar</button>
        </div>
      </div>
    `;
  });

  pendentesDiv.innerHTML += `
    <div style="text-align:center;margin-top:10px;">
      <button onclick="proximaPagina()">Próxima Página</button>
    </div>
  `;
}

window.proximaPagina = () => {
  paginaAtual++;
  carregarPedidos();
};

window.aprovar = async (id) => {
  await updateDoc(doc(db, "vendas", id), { status: "aprovado" });
  ultimoDoc = null;
  carregarPedidos();
};

window.reprovar = async (id) => {
  const motivo = prompt("Informe o motivo da reprovação:");
  if (!motivo) return;

  await updateDoc(doc(db, "vendas", id), { 
    status: "reprovado",
    motivoReprovacao: motivo
  });

  ultimoDoc = null;
  carregarPedidos();
};

carregarPedidos();
</script>

</body>
</html>
