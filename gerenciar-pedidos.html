<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:900px; margin:auto; padding:16px; }
h1,h2 { margin:10px 0; }
.card {
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-right:6px;
}
.aprovar { background:#2e7d32; color:#fff; }
.reprovar { background:#c62828; color:#fff; }
.voltar { background:#1976d2; color:#fff; margin-bottom:20px; }
.status-aprovado { color:#2e7d32; font-weight:bold; }
.status-reprovado { color:#c62828; font-weight:bold; }
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<h2>Pedidos Pendentes de Aprovação</h2>
<div id="pendentes"></div>

<h2>Status do Pedido</h2>
<div id="finalizados"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  carregarPedidos();
});

async function carregarPedidos() {
  const pendentesDiv = document.getElementById("pendentes");
  const finalizadosDiv = document.getElementById("finalizados");

  pendentesDiv.innerHTML = "";
  finalizadosDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "vendas"));

  snapshot.forEach(d => {
    const v = d.data();
    const status = v.status || "pendente";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <b>Pedido:</b> ${v.pedido}<br>
      <b>Modelo:</b> ${v.produto?.modelo || "-"}<br>
      <b>Cliente:</b> ${v.cliente?.nome || "-"}<br>
      <b>Vendedor:</b> ${v.vendedorNome || "-"}<br>
      <b>Entrega:</b> ${v.dataEntrega || "-"}<br>
      <b>Pagamento:</b> ${v.pagamento?.tipo || v.pagamento || "-"}<br>
      <b>Valor:</b> ${
        v.produto?.total
          ? v.produto.total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
          : "R$ 0,00"
      }<br>
    `;

    if (status === "pendente") {
      const btnAprovar = document.createElement("button");
      btnAprovar.textContent = "Aprovar";
      btnAprovar.className = "aprovar";
      btnAprovar.onclick = () => atualizarStatus(d.id, "aprovado");

      const btnReprovar = document.createElement("button");
      btnReprovar.textContent = "Reprovar";
      btnReprovar.className = "reprovar";
      btnReprovar.onclick = () => atualizarStatus(d.id, "reprovado");

      card.appendChild(btnAprovar);
      card.appendChild(btnReprovar);

      pendentesDiv.appendChild(card);
    } else {
      const statusSpan = document.createElement("div");
      statusSpan.className =
        status === "aprovado" ? "status-aprovado" : "status-reprovado";
      statusSpan.textContent = `Status: ${status.toUpperCase()}`;

      card.appendChild(statusSpan);
      finalizadosDiv.appendChild(card);
    }
  });
}

async function atualizarStatus(id, novoStatus) {
  await updateDoc(doc(db, "vendas", id), { status: novoStatus });
  carregarPedidos();
}
</script>

</body>
</html>
