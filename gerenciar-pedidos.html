<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

h1 {
  margin-bottom: 10px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

select, button {
  padding: 10px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
}

button {
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}

button.voltar {
  background: #555;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.status {
  font-weight: bold;
  margin-bottom: 6px;
}

.acoes {
  margin-top: 10px;
}

.acoes button {
  margin-right: 8px;
}

.aprovar { background: #2e7d32; }
.reprovar { background: #c62828; }
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <h1>Gerenciar Pedidos</h1>
    <button class="voltar" onclick="voltar()">⬅ Voltar ao Dashboard</button>
  </div>

  <label>Filtrar por vendedor</label>
  <select id="filtroVendedor">
    <option value="">Todos</option>
  </select>

  <div id="listaPedidos"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let vendas = [];

onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  carregarPedidos();
});

async function carregarPedidos() {
  const snap = await getDocs(collection(db, "vendas"));
  vendas = [];
  listaPedidos.innerHTML = "";
  filtroVendedor.innerHTML = `<option value="">Todos</option>`;

  snap.forEach(docSnap => {
    const v = docSnap.data();
    vendas.push({ id: docSnap.id, ...v });

    if (v.vendedorNome) {
      const opt = document.createElement("option");
      opt.value = v.vendedorNome;
      opt.textContent = v.vendedorNome;
      filtroVendedor.appendChild(opt);
    }
  });

  renderizar();
}

filtroVendedor.onchange = renderizar;

function renderizar() {
  listaPedidos.innerHTML = "";

  vendas
    .filter(v => !filtroVendedor.value || v.vendedorNome === filtroVendedor.value)
    .forEach(v => {

      const pagamentoTexto = v.pagamento?.tipo
        ? v.pagamento.tipo.toUpperCase() +
          (v.pagamento.tipo === "prazo" ? ` (${v.pagamento.parcelas}x)` : "")
        : "Não informado";

    let valorTotal = "R$ 0,00";

if (v.produto && typeof v.produto.total === "number") {
  valorTotal = v.produto.total.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="status">Status: ${v.status || "pendente"}</div>
        <p><strong>Pedido:</strong> ${v.pedido}</p>
        <p><strong>Vendedor:</strong> ${v.vendedorNome}</p>
        <p><strong>Cliente:</strong> ${v.cliente?.nome}</p>
        <p><strong>Entrega:</strong> ${v.dataEntrega}</p>
        <p><strong>Pagamento:</strong> ${pagamentoTexto}</p>
        <p><strong>Valor:</strong> ${valorTotal}</p>

        <div class="acoes">
          <button class="aprovar" onclick="alterarStatus('${v.id}','aprovada')">Aprovar</button>
          <button class="reprovar" onclick="alterarStatus('${v.id}','reprovada')">Reprovar</button>
        </div>
      `;

      listaPedidos.appendChild(card);
    });
}

async function alterarStatus(id, status) {
  await updateDoc(doc(db, "vendas", id), { status });
  carregarPedidos();
}

window.voltar = () => {
  location.href = "jader.html";
};
</script>

</body>
</html>
