<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;padding:14px;border-radius:10px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;margin:4px}
.aprovar{background:#2e7d32;color:#fff}
.reprovar{background:#c62828;color:#fff}
.voltar{background:#1976d2;color:#fff}
select{padding:10px;width:100%;margin:8px 0;border-radius:8px}
</style>
</head>

<body>
<div class="container">

<button class="voltar" onclick="location.href='jader.html'">⬅ Voltar ao Dashboard</button>

<h1>Gerenciar Pedidos</h1>

<label>Filtrar por vendedor</label>
<select id="filtroVendedor">
  <option value="">Todos</option>
</select>

<div id="lista"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");
const filtroVendedor = document.getElementById("filtroVendedor");

let vendas = [];

function formatarPagamento(p) {
  if (!p) return "Não informado";
  if (typeof p === "string") return p;

  if (p.tipo === "avista") return "À vista";
  if (p.tipo === "pix") return "Pix";
  if (p.tipo === "prazo") return `A prazo (${p.parcelas || 1}x)`;

  return "Não informado";
}

async function carregarVendas() {
  vendas = [];
  lista.innerHTML = "";
  filtroVendedor.innerHTML = `<option value="">Todos</option>`;

  const snap = await getDocs(collection(db, "vendas"));
  const vendedoresSet = new Set();

  snap.forEach(docSnap => {
    const v = docSnap.data();
    v.id = docSnap.id;

    if (!v.status) v.status = "pendente";
    if (!v.vendedorNome) v.vendedorNome = "Vendedor não informado";

    vendas.push(v);
    vendedoresSet.add(v.vendedorNome);
  });

  vendedoresSet.forEach(v => {
    const op = document.createElement("option");
    op.value = v;
    op.textContent = v;
    filtroVendedor.appendChild(op);
  });

  render();
}

function render() {
  lista.innerHTML = "";
  const vendedor = filtroVendedor.value;

  vendas
    .filter(v => v.status === "pendente")
    .filter(v => !vendedor || v.vendedorNome === vendedor)
    .forEach(v => {
      lista.innerHTML += `
        <div class="card">
          <b>Pedido:</b> ${v.pedido || "—"}<br>
          <b>Vendedor:</b> ${v.vendedorNome}<br>
          <b>Cliente:</b> ${v.cliente?.nome || ""}<br>
          <b>Pagamento:</b> ${formatarPagamento(v.pagamento)}<br>
          <b>Total:</b> R$ ${(v.produto?.total || 0).toFixed(2)}<br><br>

          <button class="aprovar" onclick="aprovar('${v.id}')">Aprovar</button>
          <button class="reprovar" onclick="reprovar('${v.id}')">Reprovar</button>
        </div>
      `;
    });
}

window.aprovar = async id => {
  await updateDoc(doc(db, "vendas", id), { status: "aprovado" });
  carregarVendas();
};

window.reprovar = async id => {
  const motivo = prompt("Motivo da reprovação:");
  if (!motivo) return;
  await updateDoc(doc(db, "vendas", id), {
    status: "reprovado",
    motivoReprovacao: motivo
  });
  carregarVendas();
};

filtroVendedor.onchange = render;

carregarVendas();
</script>
</body>
</html>
