<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jader - Gerenciar Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{max-width:1200px;margin:auto;padding:20px}
h1{margin-bottom:10px}
select,button{padding:10px;border-radius:6px;border:1px solid #ccc}
button{cursor:pointer}
.aprovar{background:#2e7d32;color:#fff}
.reprovar{background:#c62828;color:#fff}
.card{background:#fff;padding:15px;margin-top:10px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.status{font-weight:bold}
</style>
</head>

<body>
<div class="container">

<h1>Gerenciar Pedidos</h1>

<select id="filtroVendedor">
  <option value="">Todos os vendedores</option>
</select>

<div id="listaPedidos"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const JADER_EMAIL = "EMAIL_DO_JADER_AQUI";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let vendas = [];

onAuthStateChanged(auth, async user=>{
  if(!user || user.email !== JADER_EMAIL){
    location.href="login.html";
    return;
  }
  await carregarVendas();
});

async function carregarVendas(){
  const snap = await getDocs(collection(db,"vendas"));
  vendas = [];
  listaPedidos.innerHTML="";
  filtroVendedor.innerHTML='<option value="">Todos os vendedores</option>';

  snap.forEach(d=>{
    const v = d.data();
    v.id = d.id;
    vendas.push(v);

    if(![...filtroVendedor.options].some(o=>o.value===v.vendedorEmail)){
      filtroVendedor.innerHTML += `<option value="${v.vendedorEmail}">${v.vendedorNome}</option>`;
    }
  });

  render();
}

function render(){
  listaPedidos.innerHTML="";
  const filtro = filtroVendedor.value;

  vendas
  .filter(v=>!filtro || v.vendedorEmail===filtro)
  .forEach(v=>{
    listaPedidos.innerHTML+=`
      <div class="card">
        <div><b>Pedido:</b> ${v.pedido}</div>
        <div><b>Vendedor:</b> ${v.vendedorNome}</div>
        <div><b>Cliente:</b> ${v.cliente.nome}</div>
        <div><b>Total:</b> R$ ${v.produto.total.toFixed(2)}</div>
        <div class="status">Status: ${v.status || "Pendente"}</div>
        <br>
        <button class="aprovar" onclick="aprovar('${v.id}')">Aprovar</button>
        <button class="reprovar" onclick="reprovar('${v.id}')">Reprovar</button>
      </div>
    `;
  });
}

filtroVendedor.onchange = render;

window.aprovar = async id=>{
  await updateDoc(doc(db,"vendas",id),{
    status:"Aprovada",
    motivoReprovacao:""
  });
  carregarVendas();
};

window.reprovar = async id=>{
  const motivo = prompt("Informe o motivo da reprovação:");
  if(!motivo) return;

  await updateDoc(doc(db,"vendas",id),{
    status:"Reprovada",
    motivoReprovacao:motivo
  });
  carregarVendas();
};
</script>
</body>
</html>
