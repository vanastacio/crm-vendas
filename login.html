<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f6f8;
  color: #333;
}
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
}
h1 {
  margin-bottom: 15px;
}
label, input, button {
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
}
button {
  background: #1976d2;
  color: #fff;
  border: none;
  cursor: pointer;
}
button:active {
  background: #125aa0;
}
.error {
  color: red;
  font-size: 14px;
  margin-bottom: 10px;
}
.links {
  text-align: center;
  margin-top: 10px;
}
.links a {
  color: #1976d2;
  text-decoration: none;
  display: block;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="container">

<h1>Login</h1>

<div class="error" id="loginError"></div>

<label>Email</label>
<input type="email" id="email" required>

<label>Senha</label>
<input type="password" id="senha" required>

<button id="btnLogin">Entrar</button>

<div class="links">
  <a href="cadastro.html">Criar conta</a>
  <a href="recuperar.html">Esqueci minha senha</a>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

// 🔥 Init
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 📌 EMAIL DO JADER (AJUSTE SE PRECISAR)
const EMAIL_JADER = "jader@hotmail.com";

// 🔐 Login
btnLogin.onclick = async () => {
  loginError.textContent = "";

  try {
    const cred = await signInWithEmailAndPassword(
      auth,
      email.value,
      senha.value
    );

    const user = cred.user;

    // 👉 DECISÃO DE ROTA
    if (user.email === EMAIL_JADER) {
      window.location.href = "jader.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (e) {
    loginError.textContent = "Email ou senha inválidos.";
  }
};

// 🔁 Se já estiver logado
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (user.email === EMAIL_JADER) {
      window.location.href = "jader.html";
    } else {
      window.location.href = "index.html";
    }
  }
});
</script>

</body>
</html>
