<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* 🔥 FUNDO PREMIUM */
  background: url("fundo.jpg") no-repeat center center fixed;
  background-size: cover;
}

.container {
  width: 100%;
  max-width: 380px;
  padding: 40px;
  background: transparent;
}

/* Esconde o logo antigo */
.logo-container {
  display: none;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  color: #d4af37; /* dourado */
}

label {
  color: #d4af37;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px 0;
  border-radius: 8px;
  border: 1px solid #d4af37;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 16px;
}

input::placeholder {
  color: #ccc;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;

  background: linear-gradient(90deg, #d4af37, #b8860b);
  color: black;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
}

.error {
  color: #ff4d4d;
  font-size: 14px;
  margin-bottom: 10px;
  text-align: center;
}

.links {
  text-align: center;
  margin-top: 15px;
}

.links a {
  color: #d4af37;
  text-decoration: none;
  display: block;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="container">

<h1>Login</h1>

<div class="error" id="loginError"></div>

<label>Email</label>
<input type="email" id="email" required>

<label>Senha</label>
<input type="password" id="senha" required>

<button id="btnLogin">Entrar</button>

<div class="links">
  <a href="cadastro.html">Criar conta</a>
  <a href="recuperar.html">Esqueci minha senha</a>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const EMAIL_JADER = "jader@hotmail.com";

btnLogin.onclick = async () => {
  loginError.textContent = "";

  try {
    const cred = await signInWithEmailAndPassword(
      auth,
      email.value,
      senha.value
    );

    const user = cred.user;

    if (user.email === EMAIL_JADER) {
      window.location.href = "jader.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (e) {
    loginError.textContent = "Email ou senha inválidos.";
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    if (user.email === EMAIL_JADER) {
      window.location.href = "jader.html";
    } else {
      window.location.href = "index.html";
    }
  }
});
</script>

</body>
</html>
