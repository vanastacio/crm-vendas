<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#f4f6f8;
  color:#333;
}
.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.top-menu {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.top-menu button {
  padding:14px;
  border:none;
  border-radius:8px;
  background:#1976d2;
  color:#fff;
  cursor:pointer;
}
.top-menu button.sair {
  background:#e53935;
}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}
.card {
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
canvas {
  max-height:220px;
}
</style>
</head>

<body>
<div class="container">

  <!-- MENU -->
  <div class="top-menu">
    <button onclick="location.href='gerenciar-pedidos.html'">Gerenciar Pedidos</button>
    <button>Financeiro</button>
    <button>Indicadores</button>
    <button>Estoque</button>
    <button class="sair" id="btnSair">Sair</button>
  </div>

  <!-- DASHBOARD -->
  <div class="cards">

    <div class="card">
      <h3>Status das Vendas</h3>
      <canvas id="statusChart"></canvas>
    </div>

    <div class="card">
      <h3>Formas de Pagamento</h3>
      <canvas id="pagamentoChart"></canvas>
    </div>

    <div class="card">
      <h3>Quantidade de Vendas</h3>
      <canvas id="quantidadeChart"></canvas>
    </div>

    <div class="card">
      <h3>Valores de Vendas</h3>
      <canvas id="valoresChart"></canvas>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 AUTH */
onAuthStateChanged(auth, user=>{
  if(!user) location.href="login.html";
});

/* 🚪 LOGOUT */
btnSair.onclick = async ()=>{
  await signOut(auth);
  location.href="login.html";
};

/* 📊 DADOS */
const statusCount = {};
const pagamentoCount = {};
let totalVendas = 0;
let totalValor = 0;

const vendasSnap = await getDocs(collection(db,"vendas"));

vendasSnap.forEach(doc=>{
  const v = doc.data();

  statusCount[v.status || "pendente"] = (statusCount[v.status || "pendente"] || 0) + 1;
  pagamentoCount[v.pagamento || "não informado"] = (pagamentoCount[v.pagamento || "não informado"] || 0) + 1;

  totalVendas++;
  totalValor += Number(v.produto?.total || 0);
});

/* 📈 GRÁFICOS */
new Chart(statusChart,{
  type:"pie",
  data:{
    labels:Object.keys(statusCount),
    datasets:[{data:Object.values(statusCount)}]
  }
});

new Chart(pagamentoChart,{
  type:"pie",
  data:{
    labels:Object.keys(pagamentoCount),
    datasets:[{data:Object.values(pagamentoCount)}]
  }
});

new Chart(quantidadeChart,{
  type:"bar",
  data:{
    labels:["Total de Vendas"],
    datasets:[{data:[totalVendas]}]
  }
});

new Chart(valoresChart,{
  type:"bar",
  data:{
    labels:["Valor Total"],
    datasets:[{data:[totalValor]}]
  }
});
</script>

</body>
</html>
