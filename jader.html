<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8;}
.container{max-width:1200px;margin:auto;padding:16px;}
h1{margin-bottom:16px;}

.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.menu button{
  padding:16px;
  border-radius:12px;
  border:none;
  font-size:16px;
  cursor:pointer;
  background:#1976d2;
  color:white;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

.card{
  background:white;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

canvas{margin-top:10px;}
</style>
</head>

<body>
<div class="container">

<h1>Dashboard Geral</h1>

<div class="menu">
  <button onclick="location.href='jader-gerenciar.html'">Gerenciar Pedidos</button>
  <button>Financeiro</button>
  <button>Indicadores</button>
  <button>Estoque</button>
</div>

<div class="dashboard">

<div class="card">
  <h3>Status das Vendas</h3>
  <canvas id="statusChart"></canvas>
</div>

<div class="card">
  <h3>Formas de Pagamento</h3>
  <canvas id="pagamentoChart"></canvas>
</div>

<div class="card">
  <h3>Quantidade de Vendas</h3>
  <p id="totalVendas"></p>
  <p id="vendasSemana"></p>
  <p id="vendasMes"></p>
</div>

<div class="card">
  <h3>Valores</h3>
  <p id="valorTotal"></p>
  <p id="ticketMedio"></p>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Segurança
onAuthStateChanged(auth,user=>{
  if(!user || user.email!=="jader@hotmail.com"){
    location.href="login.html";
  }
  carregarDashboard();
});

async function carregarDashboard(){
  const snap = await getDocs(collection(db,"vendas"));

  let statusCount={};
  let pagamentoCount={};
  let total=0;
  let somaValores=0;

  const agora = new Date();
  let semana=0, mes=0;

  snap.forEach(d=>{
    const v=d.data();

    statusCount[v.statusVenda]=(statusCount[v.statusVenda]||0)+1;
    pagamentoCount[v.pagamento]=(pagamentoCount[v.pagamento]||0)+1;

    total++;
    somaValores+=v.produto.total;

    const data=new Date(v.dataPedido);
    if(data >= new Date(agora-7*86400000)) semana++;
    if(data.getMonth()===agora.getMonth()) mes++;
  });

  // 📊 Status
  new Chart(statusChart,{
    type:'pie',
    data:{
      labels:Object.keys(statusCount),
      datasets:[{data:Object.values(statusCount)}]
    }
  });

  // 💳 Pagamento
  new Chart(pagamentoChart,{
    type:'doughnut',
    data:{
      labels:Object.keys(pagamentoCount),
      datasets:[{data:Object.values(pagamentoCount)}]
    }
  });

  totalVendas.textContent = `Total de vendas: ${total}`;
  vendasSemana.textContent = `Vendas na semana: ${semana}`;
  vendasMes.textContent = `Vendas no mês: ${mes}`;

  valorTotal.textContent = `Faturamento total: ${somaValores.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}`;
  ticketMedio.textContent = `Ticket médio: ${(somaValores/total||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}`;
}
</script>

</body>
</html>
