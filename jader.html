<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Dashboard Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f4f6f8;
  color:#333;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.menu-topo {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.menu-topo button {
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#1976d2;
  color:#fff;
  cursor:pointer;
}

.menu-topo button:hover {
  background:#125aa0;
}

.dashboard {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
  gap:20px;
}

.card {
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card h3 {
  margin-bottom:10px;
  font-size:16px;
  text-align:center;
}

canvas {
  width:100% !important;
  height:220px !important;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logout {
  background:#e53935;
  border:none;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <h1>Dashboard - Jader</h1>
    <button class="logout" id="btnSair">Sair</button>
  </div>

  <!-- 🔹 BOTÕES PRINCIPAIS -->
  <div class="menu-topo">
    <button id="btnPedidos">Gerenciar Pedidos</button>
    <button id="btnFinanceiro">Financeiro</button>
    <button id="btnIndicadores">Indicadores</button>
    <button id="btnEstoque">Estoque</button>
  </div>

  <!-- 🔹 DASHBOARDS -->
  <div class="dashboard">

    <div class="card">
      <h3>Status das Vendas</h3>
      <canvas id="graficoStatus"></canvas>
    </div>

    <div class="card">
      <h3>Formas de Pagamento</h3>
      <canvas id="graficoPagamento"></canvas>
    </div>

    <div class="card">
      <h3>Quantidade de Vendas</h3>
      <canvas id="graficoQuantidade"></canvas>
    </div>

    <div class="card">
      <h3>Valores de Vendas</h3>
      <canvas id="graficoValores"></canvas>
    </div>

  </div>

</div>

<!-- 🔹 LIB CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 Auth */
onAuthStateChanged(auth, user => {
  if(!user) location.href="login.html";
});

/* 🚪 Logout */
document.getElementById("btnSair").onclick = async ()=>{
  await signOut(auth);
  location.href="login.html";
};

/* 🔗 CONEXÃO DO BOTÃO GERENCIAR PEDIDOS */
document.getElementById("btnPedidos").addEventListener("click", ()=>{
  window.location.href = "gerenciar-pedidos.html";
});

/* 📊 Buscar vendas */
const vendasSnap = await getDocs(collection(db,"vendas"));
const vendas = vendasSnap.docs.map(d=>d.data());

/* 📊 Status */
const statusCount = { pendente:0, aprovado:0, reprovado:0, producao:0, finalizado:0 };
vendas.forEach(v=>{
  statusCount[v.status || "pendente"]++;
});

/* 📊 Gráfico Status */
new Chart(graficoStatus,{
  type:"doughnut",
  data:{
    labels:Object.keys(statusCount),
    datasets:[{ data:Object.values(statusCount) }]
  }
});

/* 📊 Pagamento */
const pagamentos = {};
vendas.forEach(v=>{
  pagamentos[v.pagamento]=(pagamentos[v.pagamento]||0)+1;
});

new Chart(graficoPagamento,{
  type:"pie",
  data:{
    labels:Object.keys(pagamentos),
    datasets:[{ data:Object.values(pagamentos) }]
  }
});

/* 📊 Quantidade */
new Chart(graficoQuantidade,{
  type:"bar",
  data:{
    labels:["Total"],
    datasets:[{
      label:"Vendas",
      data:[vendas.length]
    }]
  }
});

/* 📊 Valores */
const totalValor = vendas.reduce((s,v)=>s+(v.produto?.total||0),0);

new Chart(graficoValores,{
  type:"bar",
  data:{
    labels:["Valor Total"],
    datasets:[{
      label:"R$",
      data:[totalValor]
    }]
  }
});
</script>

</body>
</html>
