<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{max-width:1200px;margin:auto;padding:20px}
.top-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.top-menu button{padding:14px;font-size:15px;border:none;border-radius:8px;background:#1976d2;color:#fff;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
canvas{max-height:260px}
</style>
</head>

<body>
<div class="container">

<h1>Dashboard Geral</h1>

<div class="top-menu">
<button>Gerenciar Pedidos</button>
<button>Financeiro</button>
<button>Indicadores</button>
<button>Estoque</button>
</div>

<div class="cards">
<div class="card">
<h3>Status das Vendas</h3>
<canvas id="statusChart"></canvas>
</div>

<div class="card">
<h3>Formas de Pagamento</h3>
<canvas id="pagamentoChart"></canvas>
</div>

<div class="card">
<h3>Quantidade de Vendas</h3>
<canvas id="quantidadeChart"></canvas>
</div>

<div class="card">
<h3>Valores de Vendas</h3>
<canvas id="valorChart"></canvas>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async user=>{
  if(!user || user.email!=="jader@hotmail.com"){
    location.href="login.html";
    return;
  }
  carregarDashboard();
});

async function carregarDashboard(){
  const snap = await getDocs(collection(db,"vendas"));

  let statusCount={}, pagamentoCount={}, vendasPorMes={}, valorPorVendedor={};

  snap.forEach(doc=>{
    const v = doc.data();

    statusCount[v.statusVenda||"Pendente"] = (statusCount[v.statusVenda||"Pendente"]||0)+1;
    pagamentoCount[v.pagamento] = (pagamentoCount[v.pagamento]||0)+1;

    const mes = new Date(v.dataPedido).toLocaleString("pt-BR",{month:"short",year:"numeric"});
    vendasPorMes[mes] = (vendasPorMes[mes]||0)+1;

    valorPorVendedor[v.vendedorNome] = (valorPorVendedor[v.vendedorNome]||0) + (v.produto.total||0);
  });

  new Chart(statusChart,{
    type:"doughnut",
    data:{labels:Object.keys(statusCount),datasets:[{data:Object.values(statusCount)}]}
  });

  new Chart(pagamentoChart,{
    type:"pie",
    data:{labels:Object.keys(pagamentoCount),datasets:[{data:Object.values(pagamentoCount)}]}
  });

  new Chart(quantidadeChart,{
    type:"bar",
    data:{labels:Object.keys(vendasPorMes),datasets:[{label:"Vendas",data:Object.values(vendasPorMes)}]}
  });

  new Chart(valorChart,{
    type:"bar",
    data:{labels:Object.keys(valorPorVendedor),datasets:[{label:"R$",data:Object.values(valorPorVendedor)}]}
  });
}
</script>
</body>
</html>
