<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
.container{max-width:1100px;margin:auto;padding:20px}
h1{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
canvas{margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center}
button{padding:10px 16px;border:none;border-radius:8px;background:#1976d2;color:#fff;cursor:pointer}
button:hover{background:#125aa0}
.valor{font-size:22px;font-weight:bold}
</style>
</head>

<body>
<div class="container">

  <div style="
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
">
  <button onclick="location.href='gerenciar-pedidos.html'">Gerenciar Pedidos</button>
  <button onclick="location.href='financeiro.html'">Financeiro</button>
  <button onclick="location.href='indicadores.html'">Indicadores</button>
  <button onclick="location.href='estoque.html'">Estoque</button>
</div>

<div class="topbar">
  <h1>Dashboard Geral</h1>
  <button id="btnSair">Sair</button>
</div>

<!-- CARDS -->
<div class="grid">
  <div class="card">Total de Vendas<br><span class="valor" id="totalVendas">0</span></div>
  <div class="card">Pendentes<br><span class="valor" id="pendentes">0</span></div>
  <div class="card">Valor Aprovado<br><span class="valor" id="valorAprovado">R$ 0,00</span></div>
  <div class="card">Ticket Médio<br><span class="valor" id="ticketMedio">R$ 0,00</span></div>
</div>

<br>

<!-- GRÁFICOS -->
<div class="grid">
  <div class="card">
    Status das Vendas
    <canvas id="grafStatus"></canvas>
  </div>

  <div class="card">
    Formas de Pagamento
    <canvas id="grafPagamento"></canvas>
  </div>

  <div class="card">
    Quantidade de Vendas
    <canvas id="grafQuantidade"></canvas>
  </div>

  <div class="card">
    Valores de Vendas
    <canvas id="grafValores"></canvas>
  </div>
</div>

<br>

<div class="card">
  Vendas por Vendedor
  <canvas id="grafVendedores"></canvas>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user=>{
  if(!user || user.email !== "jader@hotmail.com"){
    location.href="login.html";
  }
});

btnSair.onclick=async()=>{
  await signOut(auth);
  location.href="login.html";
};

const vendas = await getDocs(collection(db,"vendas"));

let statusCount={}, pagamentoCount={}, vendedorValor={}, total=0, pend=0, aprovadoValor=0;

vendas.forEach(d=>{
  const v=d.data();
  const valor=Number(v.total)||0;
  const status=(v.status||"pendente").toLowerCase();
  const pag=(v.pagamento?.tipo||"não informado").toLowerCase();

  statusCount[status]=(statusCount[status]||0)+1;
  pagamentoCount[pag]=(pagamentoCount[pag]||0)+1;

  total++;
  if(status==="pendente") pend++;

  if(status==="aprovado"){
    aprovadoValor+=valor;
    vendedorValor[v.vendedorNome]=(vendedorValor[v.vendedorNome]||0)+valor;
  }
});

totalVendas.textContent=total;
pendentes.textContent=pend;
valorAprovado.textContent=aprovadoValor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
ticketMedio.textContent=(aprovadoValor/(Object.keys(vendedorValor).length||1))
.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

new Chart(grafStatus,{type:"doughnut",data:{labels:Object.keys(statusCount),datasets:[{data:Object.values(statusCount)}]}});
new Chart(grafPagamento,{type:"bar",data:{labels:Object.keys(pagamentoCount),datasets:[{data:Object.values(pagamentoCount)}]}});
new Chart(grafQuantidade,{type:"bar",data:{labels:["Vendas"],datasets:[{data:[total]}]}});
new Chart(grafValores,{type:"bar",data:{labels:["Aprovado"],datasets:[{data:[aprovadoValor]}]}});
new Chart(grafVendedores,{type:"bar",data:{labels:Object.keys(vendedorValor),datasets:[{data:Object.values(vendedorValor)}]}});
</script>

</body>
</html>
