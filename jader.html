<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CRM - Painel do Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f6f8;}
.container{max-width:1100px;margin:auto;padding:20px;}
h1{margin-bottom:10px;}
select,button{padding:10px;border-radius:8px;font-size:15px;}
button{cursor:pointer;border:none;}
.aprovar{background:#2e7d32;color:#fff;}
.reprovar{background:#c62828;color:#fff;}
.logout{background:#555;color:#fff;margin-bottom:15px;}
.card{
  background:#fff;padding:16px;border-radius:12px;
  margin-top:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.status{font-weight:bold;}
</style>
</head>

<body>
<div class="container">

<h1>Painel do Jader</h1>

<button class="logout" id="btnSair">Sair</button>

<br><br>

<label>Filtrar por vendedor</label>
<select id="filtroVendedor">
  <option value="">Todos</option>
</select>

<div id="listaVendas"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, collection, getDocs,
  updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const EMAIL_ADMIN = "jader@hotmail.com"; // 🔴 ALTERE AQUI

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const lista = document.getElementById("listaVendas");
const filtro = document.getElementById("filtroVendedor");

let vendasCache = [];

// 🔐 Auth
onAuthStateChanged(auth, user=>{
  if(!user || user.email !== EMAIL_ADMIN){
    alert("Acesso não autorizado");
    location.href="login.html";
  }
  carregarTudo();
});

// 🚪 Logout
btnSair.onclick = async ()=>{
  await signOut(auth);
  location.href="login.html";
};

// 📄 Carregar vendas
async function carregarTudo(){
  lista.innerHTML="";
  filtro.innerHTML='<option value="">Todos</option>';
  vendasCache = [];

  const snap = await getDocs(collection(db,"vendas"));
  const vendedores = new Set();

  snap.forEach(d=>{
    const v = d.data();
    vendasCache.push({id:d.id,...v});
    vendedores.add(v.vendedorNome);
  });

  vendedores.forEach(v=>{
    filtro.innerHTML += `<option>${v}</option>`;
  });

  render();
}

// 🔍 Filtro
filtro.onchange = render;

function render(){
  lista.innerHTML="";
  const f = filtro.value;

  vendasCache
    .filter(v => !f || v.vendedorNome === f)
    .forEach(v=>{
      lista.innerHTML += `
        <div class="card">
          <b>${v.produto.modelo}</b> (${v.produto.tamanho})<br>
          <b>Vendedor:</b> ${v.vendedorNome}<br>
          <b>Cliente:</b> ${v.cliente.nome}<br>
          <b>Total:</b> R$ ${v.produto.total.toFixed(2)}<br>
          <b>Status:</b> <span class="status">${v.status}</span><br>
          ${v.observacoes ? `<b>Obs:</b> ${v.observacoes}<br>` : ""}
          <br>
          <button class="aprovar" onclick="aprovar('${v.id}')">Aprovar</button>
          <button class="reprovar" onclick="reprovar('${v.id}')">Reprovar</button>
        </div>
      `;
    });
}

// ✅ Aprovar
window.aprovar = async id=>{
  await updateDoc(doc(db,"vendas",id),{status:"aprovada"});
  carregarTudo();
};

// ❌ Reprovar
window.reprovar = async id=>{
  const motivo = prompt("Motivo da reprovação:");
  if(!motivo) return;
  await updateDoc(doc(db,"vendas",id),{
    status:"reprovada",
    motivoReprovacao: motivo
  });
  carregarTudo();
};
</script>

</body>
</html>
