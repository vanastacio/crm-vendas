<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== FUNDO (igual das outras páginas) ===== */
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:url("fundo.jpg") no-repeat center center fixed;
  background-size:cover;
  color:#fff;
}

/* leve overlay pra dar contraste sem escurecer demais */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 10%, rgba(33,150,243,0.20), transparent 45%),
    radial-gradient(circle at 80% 30%, rgba(76,175,80,0.12), transparent 45%),
    rgba(0,0,0,0.25);
  z-index:-1;
}

/* ===== LAYOUT ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:32px 22px;
}

/* ===== TOPO ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}

.title{
  font-size:40px;
  font-weight:800;
  letter-spacing:.3px;
  margin:0;
}

/* pill sair + avatar */
.top-actions{
  display:flex;
  gap:12px;
  align-items:center;
}

.btn-pill{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(12px);
  cursor:pointer;
  color:#fff;
  font-weight:700;
  transition:.25s ease;
}

.btn-pill:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.12);
}

.avatar{
  width:44px;
  height:44px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(12px);
  display:grid;
  place-items:center;
  font-size:20px;
}

/* ===== MENU ===== */
.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin:18px 0 18px;
}

.menu button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:16px 18px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  color:#fff;
  font-weight:800;
  font-size:16px;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  box-shadow:0 10px 26px rgba(0,0,0,0.45);
  transition:.25s ease;
}

.menu button:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 34px rgba(0,0,0,0.55);
}

/* ícones do menu */
.icon{
  width:20px;
  height:20px;
  display:inline-block;
}
.icon svg{ width:20px; height:20px; fill:#fff; opacity:.95; }

/* ===== CARDS (GLASS) ===== */
.dashboard{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:18px;
}

.card{
  background:rgba(0,0,0,0.22);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(14px);
  box-shadow:0 14px 36px rgba(0,0,0,0.40);
}

.card h2{
  margin:0 0 10px;
  font-size:22px;
  font-weight:900;
  letter-spacing:.2px;
}

/* ===== STATUS CARD GRANDE ===== */
.card--wide{
  grid-column:span 2;
  padding:18px 18px 10px;
}

.status-wrap{
  display:grid;
  grid-template-columns: 1.2fr .8fr;
  gap:12px;
  align-items:center;
}

.legend{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:6px 8px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
  opacity:.95;
}

.dot{
  width:14px;
  height:14px;
  border-radius:4px;
  display:inline-block;
  box-shadow:0 0 0 2px rgba(255,255,255,0.08);
}

.dot.blue{ background:#2196f3; }
.dot.orange{ background:#ff9800; }
.dot.green{ background:#4caf50; }

/* ===== RESUMO ===== */
.resumo{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:18px;
  font-weight:900;
}

#valorTotal, #ticketMedio{
  color:#79ff9a;
}

/* canvas maior e responsivo */
canvas{
  width:100% !important;
  max-height:260px;
}

/* ===== RESPONSIVO ===== */
@media (max-width:1000px){
  .menu{ grid-template-columns:1fr 1fr; }
  .dashboard{ grid-template-columns:1fr; }
  .card--wide{ grid-column:span 1; }
  .status-wrap{ grid-template-columns:1fr; }
  .title{ font-size:32px; }
}
  /* ===== REFINO PRA FICAR IGUAL À IMAGEM ===== */
.container{
  max-width: 1280px;          /* mais “cara de dashboard” */
  padding: 34px 26px;
}

.title{
  font-size: 44px;
  font-weight: 900;
}

.menu{
  gap: 18px;
  margin-top: 14px;
}

.menu button{
  border-radius: 14px;
  padding: 18px 18px;
  font-size: 16px;
  background: linear-gradient(135deg,#0d63c9,#0b4da6);
  box-shadow: 0 10px 24px rgba(0,0,0,0.45);
}

.card{
  background: rgba(0,0,0,0.18);         /* mais transparente */
  border: 1px solid rgba(255,255,255,0.16);
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}

.card--wide{
  padding: 18px;
}

.card h2{
  font-size: 22px;
  font-weight: 900;
}

canvas{
  max-height: 240px;  /* mais parecido com a imagem */
}

/* deixa os cards de baixo mais “baixos” como na imagem */
.dashboard > .card:not(.card--wide){
  min-height: 320px;
}

/* o card do status fica bem “horizontal” */
.card--wide canvas{
  max-height: 260px;
}
</style>
</head>

<body>
<div class="container">

  <!-- TOPO -->
  <div class="topbar">
    <h1 class="title">Dashboard Geral</h1>

    <div class="top-actions">
      <button id="btnSair" class="btn-pill" type="button" aria-label="Sair">
        <!-- ícone (wifi/exit estilizado simples) -->
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M10 17v-2h4v2h-4Zm-6.4 1.6 1.4-1.4A9.97 9.97 0 0 1 12 14c2.61 0 5.01 1 6.99 2.8l1.41 1.41-1.41 1.41-1.41-1.41A7.97 7.97 0 0 0 12 16c-2.09 0-4.02.8-5.58 2.2l-1.42 1.4-1.4-1.4Zm-1.6-4 1.4-1.4A14 14 0 0 1 12 10c3.7 0 7.1 1.4 9.6 3.6l1.4 1.4-1.4 1.4-1.4-1.4A12 12 0 0 0 12 12c-3.13 0-6.02 1.18-8.2 3.2l-1.4 1.4-1.4-1.4Zm-2-4 1.4-1.4A18 18 0 0 1 12 6c4.84 0 9.26 1.82 12.6 5.2l1.4 1.4-1.4 1.4-1.4-1.4A16 16 0 0 0 12 8C7.58 8 3.56 9.64 0.6 12.6l-1.4 1.4-1.4-1.4Z" />
          </svg>
        </span>
        Sair
      </button>

      <div class="avatar" title="Jader">👤</div>
    </div>
  </div>

  <!-- MENU -->
  <div class="menu">
    <button onclick="location.href='gerenciar-pedidos.html'">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 2h10v2H7V2Zm-2 4h14v14H5V6Zm2 2v10h10V8H7Zm2 2h6v2H9v-2Zm0 4h6v2H9v-2Z"/></svg>
      </span>
      Gerenciar Pedidos
    </button>

    <button type="button">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3Zm2 2v14h14V5H5Zm2 10h2v2H7v-2Zm0-4h2v3H7v-3Zm4 2h2v4h-2v-4Zm4-6h2v10h-2V7Z"/></svg>
      </span>
      Financeiro
    </button>

    <button type="button">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 7-7 1 1-8 8-4-4-5 5H3Zm0 4h18v2H3v-2Z"/></svg>
      </span>
      Indicadores
    </button>

    <button type="button">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4V4Zm0 6h16v10H4V10Zm2 2v6h12v-6H6Z"/></svg>
      </span>
      Estoque
    </button>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <!-- STATUS (GRANDE) -->
    <div class="card card--wide">
      <h2>Status das Vendas</h2>

      <div class="status-wrap">
        <div>
          <canvas id="statusChart"></canvas>
        </div>

        <!-- legenda fixa (igual da imagem) -->
        <div class="legend">
          <div class="legend-item"><span class="dot blue"></span> Ativa</div>
          <div class="legend-item"><span class="dot orange"></span> Produção</div>
          <div class="legend-item"><span class="dot green"></span> Entregue</div>
        </div>
      </div>
    </div>

    <!-- FORMAS DE PAGAMENTO -->
    <div class="card">
      <h2>Formas de Pagamento</h2>
      <canvas id="pagamentoChart"></canvas>
    </div>

    <!-- QUANTIDADE -->
    <div class="card">
      <h2>Quantidade de Vendas</h2>
      <canvas id="quantidadeChart"></canvas>
      <div class="resumo">
        <span>Total:</span>
        <span id="totalVendas">0</span>
      </div>
    </div>

    <!-- VALORES -->
    <div class="card">
      <h2>Valores de Vendas</h2>
      <canvas id="valoresChart"></canvas>
      <div class="resumo">
        <span>Total Geral:</span>
        <span id="valorTotal">R$ 0,00</span>
      </div>
      <div class="resumo">
        <span>Ticket Médio:</span>
        <span id="ticketMedio">R$ 0,00</span>
      </div>
    </div>

  </div>

</div>

<!-- ✅ SCRIPT: mantido (mesma lógica) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Proteção de acesso
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  carregarDashboard();
});

// 🚪 Logout
document.getElementById("btnSair").onclick = async () => {
  await signOut(auth);
  location.href = "login.html";
};

async function carregarDashboard() {
  const snapshot = await getDocs(collection(db, "vendas"));

  let status = { ativa:0, producao:0, entregue:0 };
  let pagamentos = {};
  let vendasPorMes = {};
  let totalVendas = 0;
  let somaValores = 0;

  snapshot.forEach(doc => {
    const v = doc.data();

    if (status.hasOwnProperty(v.status)) {
      status[v.status]++;
    }

    const pg = v.pagamento?.tipo || v.pagamento;
    if (pg) pagamentos[pg] = (pagamentos[pg] || 0) + 1;

    const mes = v.dataPedido?.slice(0,7);
    if (mes) vendasPorMes[mes] = (vendasPorMes[mes] || 0) + 1;

    const valor = Number(v.valor || v.total || v.produto?.total || 0);
    if (valor > 0) {
      somaValores += valor;
      totalVendas++;
    }
  });

  document.getElementById("totalVendas").textContent = totalVendas;
  document.getElementById("valorTotal").textContent =
    somaValores.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("ticketMedio").textContent =
    totalVendas ? (somaValores/totalVendas).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "R$ 0,00";

// ===== CHART DEFAULTS (visual) =====
Chart.defaults.color = "rgba(255,255,255,0.85)";
Chart.defaults.font.family = "'Segoe UI', Arial, sans-serif";
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.boxWidth = 10;

// ===== STATUS (sem legenda padrão, porque você já tem legenda fixa no HTML) =====
new Chart(document.getElementById("statusChart"),{
  type:"doughnut",
  data:{
    labels:["Ativa","Produção","Entregue"],
    datasets:[{
      data:[ status.ativa, status.producao, status.entregue ],
      backgroundColor:[ "#2196f3", "#ff9800", "#4caf50" ],
      borderColor: "rgba(255,255,255,0.75)",
      borderWidth: 2,
      hoverOffset: 6
    }]
  },
  options:{
    cutout: "68%",
    plugins:{
      legend:{ display:false },  // importante!
      tooltip:{ enabled:true }
    }
  }
});

// ===== PAGAMENTO =====
new Chart(document.getElementById("pagamentoChart"),{
  type:"pie",
  data:{
    labels:Object.keys(pagamentos),
    datasets:[{
      data:Object.values(pagamentos),
      borderColor: "rgba(255,255,255,0.75)",
      borderWidth: 2
    }]
  },
  options:{
    plugins:{
      legend:{ position:"top" }
    }
  }
});

// ===== QUANTIDADE =====
new Chart(document.getElementById("quantidadeChart"),{
  type:"bar",
  data:{
    labels:Object.keys(vendasPorMes),
    datasets:[{
      label:"Vendas",
      data:Object.values(vendasPorMes),
      backgroundColor:"rgba(33,150,243,0.85)",
      borderRadius: 10
    }]
  },
  options:{
    scales:{
      x:{ grid:{ display:false } },
      y:{ grid:{ color:"rgba(255,255,255,0.08)" }, ticks:{ precision:0 } }
    },
    plugins:{ legend:{ display:false } }
  }
});

// ===== VALORES =====
new Chart(document.getElementById("valoresChart"),{
  type:"bar",
  data:{
    labels:Object.keys(valoresPorMes),
    datasets:[{
      label:"Valor",
      data:Object.values(valoresPorMes),
      backgroundColor:"rgba(76,175,80,0.85)",
      borderRadius: 10
    }]
  },
  options:{
    scales:{
      x:{ grid:{ display:false } },
      y:{ grid:{ color:"rgba(255,255,255,0.08)" } }
    },
    plugins:{ legend:{ display:false } }
  }
});
}
</script>

</body>
</html>
