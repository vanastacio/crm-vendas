<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; color:#333; }
.container { max-width:1200px; margin:auto; padding:16px; }
h1 { margin-bottom:20px; }

.topo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.topo button {
  padding:10px 16px;
  font-size:14px;
  border:none;
  border-radius:8px;
  background:#e53935;
  color:#fff;
  cursor:pointer;
}
.topo button:hover { background:#c62828; }

.menu {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.menu button {
  padding:16px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#1976d2;
  color:#fff;
  cursor:pointer;
}
.menu button:hover { background:#125aa0; }

.dashboard {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card {
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.card h2 {
  margin-bottom:10px;
  font-size:18px;
}
canvas { max-height:280px; }
.resumo {
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<div class="topo">
  <h1>Dashboard Geral</h1>
  <button id="btnSair">Sair</button>
</div>

<div class="menu">
  <button onclick="location.href='gerenciar-pedidos.html'">Gerenciar Pedidos</button>
  <button>Financeiro</button>
  <button>Indicadores</button>
  <button>Estoque</button>
</div>

<div class="dashboard">

  <div class="card">
    <h2>Status das Vendas</h2>
    <canvas id="statusChart"></canvas>
  </div>

  <div class="card">
    <h2>Formas de Pagamento</h2>
    <canvas id="pagamentoChart"></canvas>
  </div>

  <div class="card">
    <h2>Quantidade de Vendas</h2>
    <canvas id="quantidadeChart"></canvas>
    <div class="resumo">
      <span>Total:</span>
      <span id="totalVendas">0</span>
    </div>
  </div>

  <div class="card">
    <h2>Valores de Vendas</h2>
    <canvas id="valoresChart"></canvas>
    <div class="resumo">
      <span>Total Geral:</span>
      <span id="valorTotal">R$ 0,00</span>
    </div>
    <div class="resumo">
      <span>Ticket Médio:</span>
      <span id="ticketMedio">R$ 0,00</span>
    </div>
  </div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Proteção de acesso
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  carregarDashboard();
});

// 🚪 Logout
document.getElementById("btnSair").onclick = async () => {
  await signOut(auth);
  location.href = "login.html";
};

async function carregarDashboard() {
  const snapshot = await getDocs(collection(db, "vendas"));

  let status = { pendente:0, aprovado:0, reprovado:0, producao:0, entregue:0 };
  let pagamentos = {};
  let vendasPorMes = {};
  let totalVendas = 0;
  let somaValores = 0;

  snapshot.forEach(doc => {
    const v = doc.data();

    status[v.status || "pendente"] = (status[v.status || "pendente"] || 0) + 1;

    const pg = v.pagamento?.tipo || v.pagamento;
    if (pg) pagamentos[pg] = (pagamentos[pg] || 0) + 1;

    const mes = v.dataPedido?.slice(0,7);
    if (mes) vendasPorMes[mes] = (vendasPorMes[mes] || 0) + 1;

    const valor = Number(v.valor || v.total || v.produto?.total || 0);
    if (valor > 0) {
      somaValores += valor;
      totalVendas++;
    }
    
  });

  document.getElementById("totalVendas").textContent = totalVendas;
  document.getElementById("valorTotal").textContent =
    somaValores.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("ticketMedio").textContent =
    totalVendas ? (somaValores/totalVendas).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "R$ 0,00";

  new Chart(statusChart,{
    type:"doughnut",
    data:{labels:Object.keys(status),datasets:[{data:Object.values(status)}]}
  });

  new Chart(pagamentoChart,{
    type:"pie",
    data:{labels:Object.keys(pagamentos),datasets:[{data:Object.values(pagamentos)}]}
  });

  new 
    Chart(document.getElementById("quantidadeChart"),{
    type:"bar",
    data:{labels:Object.keys(vendasPorMes),datasets:[{label:"Vendas",data:Object.values(vendasPorMes)}]}
  });

  new 
    Chart(document.getElementById("valoresChart"),{
    type:"bar",
    data:{labels:["Total"],datasets:[{label:"Valor",data:[somaValores]}]}
  });
}
</script>

</body>
</html>
