<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard - Jader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:url("fundo.jpg") no-repeat center center fixed;
  background-size:cover;
  color:#fff;
}

/* Container principal */
.container{
  max-width:1400px;
  margin:auto;
  padding:60px 40px;
}

/* Topo */
.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.topo h1{
  font-size:48px;
  font-weight:700;
  letter-spacing:1px;
}

#btnSair{
  padding:12px 28px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:all .3s ease;
}

#btnSair:hover{
  background:rgba(255,255,255,0.15);
}

/* Menu */
.menu{
  display:flex;
  gap:30px;
  margin-bottom:50px;
}

.menu button{
  flex:1;
  padding:20px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#1e88e5,#1565c0);
  box-shadow:0 8px 25px rgba(0,0,0,0.5);
  transition:all .3s ease;
}

.menu button:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 35px rgba(0,0,0,0.7);
}

/* Grid dashboard */
.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

/* Cards */
.card{
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  transition:all .3s ease;
}

.card:hover{
  transform:translateY(-6px);
}

.card h2{
  font-size:26px;
  margin-bottom:20px;
  font-weight:600;
}

/* Gráficos maiores */
canvas{
  max-height:350px;
}

/* Resumo valores */
.resumo{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:20px;
  font-weight:600;
}

#valorTotal{
  color:#4caf50;
}

#ticketMedio{
  color:#4caf50;
}

/* Responsivo */
@media(max-width:1000px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .menu{
    flex-direction:column;
  }
}
</style>
</head>

<body>
<div class="container">

<div class="topo">
  <h1>Dashboard Geral</h1>
  <button id="btnSair">Sair</button>
</div>

<div class="menu">
  <button onclick="location.href='gerenciar-pedidos.html'">Gerenciar Pedidos</button>
  <button>Financeiro</button>
  <button>Indicadores</button>
  <button>Estoque</button>
</div>

<div class="dashboard">

  <div class="card">
    <h2>Status das Vendas</h2>
    <canvas id="statusChart"></canvas>
  </div>

  <div class="card">
    <h2>Formas de Pagamento</h2>
    <canvas id="pagamentoChart"></canvas>
  </div>

  <div class="card">
    <h2>Quantidade de Vendas</h2>
    <canvas id="quantidadeChart"></canvas>
    <div class="resumo">
      <span>Total:</span>
      <span id="totalVendas">0</span>
    </div>
  </div>

  <div class="card">
    <h2>Valores de Vendas</h2>
    <canvas id="valoresChart"></canvas>
    <div class="resumo">
      <span>Total Geral:</span>
      <span id="valorTotal">R$ 0,00</span>
    </div>
    <div class="resumo">
      <span>Ticket Médio:</span>
      <span id="ticketMedio">R$ 0,00</span>
    </div>
  </div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlB4NN_lTrWv4sJ1PKp2m0YjoVADnIeHk",
  authDomain: "crm-vendas-43b6b.firebaseapp.com",
  projectId: "crm-vendas-43b6b",
  storageBucket: "crm-vendas-43b6b.appspot.com",
  messagingSenderId: "645002761099",
  appId: "1:645002761099:web:f194f70c351d1074ac158e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Proteção de acesso
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  carregarDashboard();
});

// 🚪 Logout
document.getElementById("btnSair").onclick = async () => {
  await signOut(auth);
  location.href = "login.html";
};

async function carregarDashboard() {
  const snapshot = await getDocs(collection(db, "vendas"));

  let status = { ativa:0, producao:0, entregue:0 };
  let pagamentos = {};
  let vendasPorMes = {};
  let totalVendas = 0;
  let somaValores = 0;

  snapshot.forEach(doc => {
    const v = doc.data();

    if (status.hasOwnProperty(v.status)) {
      status[v.status]++;
    }

    const pg = v.pagamento?.tipo || v.pagamento;
    if (pg) pagamentos[pg] = (pagamentos[pg] || 0) + 1;

    const mes = v.dataPedido?.slice(0,7);
    if (mes) vendasPorMes[mes] = (vendasPorMes[mes] || 0) + 1;

    const valor = Number(v.valor || v.total || v.produto?.total || 0);
    if (valor > 0) {
      somaValores += valor;
      totalVendas++;
    }
    
  });

  document.getElementById("totalVendas").textContent = totalVendas;
  document.getElementById("valorTotal").textContent =
    somaValores.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("ticketMedio").textContent =
    totalVendas ? (somaValores/totalVendas).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "R$ 0,00";

  new Chart(document.getElementById("statusChart"),{
  type:"doughnut",
  data:{
    labels:["Ativa","Produção","Entregue"],
    datasets:[{
      data:[
        status.ativa,
        status.producao,
        status.entregue
      ],
      backgroundColor:[
        "#2196f3",   // azul
        "#ff9800",   // laranja
        "#4caf50"    // verde
      ]
    }]
  }
});

  new 
    Chart(document.getElementById("pagamentoChart"),{
    type:"pie",
    data:{labels:Object.keys(pagamentos),datasets:[{data:Object.values(pagamentos)}]}
  });

   new Chart(document.getElementById("quantidadeChart"),{
  type:"bar",
  data:{
    labels:Object.keys(vendasPorMes),
    datasets:[{
      label:"Vendas",
      data:Object.values(vendasPorMes),
      backgroundColor:"#2196f3"
    }]
  }
});

let valoresPorMes = {};

snapshot.forEach(doc => {
  const v = doc.data();
  const mes = v.dataPedido?.slice(0,7);
  const valor = Number(v.valor || v.total || v.produto?.total || 0);

  if (mes && valor > 0) {
    valoresPorMes[mes] = (valoresPorMes[mes] || 0) + valor;
  }
});

new Chart(document.getElementById("valoresChart"),{
  type:"bar",
  data:{
    labels:Object.keys(valoresPorMes),
   datasets:[{
  label:"Valor",
  data:Object.values(valoresPorMes),
  backgroundColor:"#4caf50"
}]
  }
});
  
}
</script>

</body>
</html>
